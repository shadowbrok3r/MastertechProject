[package]
name = "database-tools"
version = "0.1.0"
edition = "2024"
publish = false
description = "Operational tools for the Mastertech SurrealDB instance — audits, migrations, cleanup."

# Pure binary crate. No `[lib]` — these tools are entirely command-line.
[[bin]]
name = "audit-references"
path = "src/bin/audit_references.rs"

[dependencies]
database.workspace = true
surrealdb.workspace = true
surrealdb-types.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
log.workspace = true
tokio.workspace = true
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
