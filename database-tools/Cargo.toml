[package]
name = "database-tools"
version = "0.1.0"
edition = "2024"
publish = false
description = "Operational tools for the Mastertech SurrealDB instance — audits, migrations, cleanup."

# Pure binary crate. No `[lib]` — these tools are entirely command-line.
[[bin]]
name = "audit-references"
path = "src/bin/audit_references.rs"

[[bin]]
name = "user-admin"
path = "src/bin/user_admin/main.rs"

[dependencies]
database.workspace = true
surrealdb.workspace = true
surrealdb-types.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
log.workspace = true
tokio.workspace = true
chrono.workspace = true
dotenvy.workspace = true
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
rpassword = "7"

[dev-dependencies]
surrealdb = { workspace = true, features = ["kv-mem"] }
