[package]
name = "mtech-ui"
version = "0.1.0"
edition = "2024"
description = "Shared egui UI helpers (theme, dock chrome, in-app logger) for Mastertech apps"

[features]
puffin = []

[dependencies]
egui_dock.workspace = true
regex.workspace = true
chrono.workspace = true
log.workspace = true
anyhow.workspace = true
serde_json.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json"] }

# Mobile targets use a renderer-less eframe (glow/glutin cannot compile there).
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
eframe = { workspace = true }

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
eframe = { version = "0.35", features = ["serde", "default_fonts"], default-features = false }
