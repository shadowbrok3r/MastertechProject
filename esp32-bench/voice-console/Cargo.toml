# Own workspace root; keeps this riscv crate out of the parent workspace.
[workspace]

[package]
name = "voice-console"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "ESP32-P4 bench voice console — push-to-talk to the shop assistant over the relay"
resolver = "2"

# 0.53 (hal 0.47 / sys 0.38) for esp32p4 support; esp-idf-svc 0.51's hal 0.45.2
# miscompiles for the P4 (Xtensa `_frxt_setup_switch`, no `Core::Core1`).
[dependencies]
log = "0.4"
anyhow = "1"
serde_json = "1"
microfft = "0.6"

# Compiled only for the on-device target; host builds test the pure DSP.
[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-svc = "0.53"

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }

# Relay WebSocket client.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_websocket_client", version = ">=1.2.0" }

# Wi-Fi for the radio-less P4 runs through the onboard ESP32-C6 over esp_hosted;
# Waveshare's own P4 example pulls both with default (SDIO) config.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_hosted", version = "*" }

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_wifi_remote", version = "*" }

# ES8311 speaker + ES7210 dual-mic codecs (the board's factory audio stack); audio_shim wraps it.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_codec_dev", version = "~1.6.2" }

# ST7703 MIPI-DSI panel driver + LVGL port; the local display_shim wraps them.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "waveshare/esp_lcd_st7703", version = "*" }

# 2.5.0 exactly: 2.6+ reference LV_COLOR_FORMAT_RGB565_SWAPPED, absent in lvgl 9.2.0.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_lvgl_port", version = "==2.5.0" }

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "lvgl/lvgl", version = "9.2.0" }

# GT911 capacitive touch (on the codecs' i2c_master bus).
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_lcd_touch_gt911", version = "^1.1" }

[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["components/audio_shim", "components/display_shim"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = "s"
debug = true
