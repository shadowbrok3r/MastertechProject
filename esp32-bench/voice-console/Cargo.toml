# Own workspace root; keeps this riscv crate out of the parent workspace.
[workspace]

[package]
name = "voice-console"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "ESP32-P4 bench voice console — Wi-Fi (via C6) + relay round-trip milestone"
resolver = "2"

# 0.53 (hal 0.47 / sys 0.38) for esp32p4 support; esp-idf-svc 0.51's hal 0.45.2
# miscompiles for the P4 (Xtensa `_frxt_setup_switch`, no `Core::Core1`).
[dependencies]
esp-idf-svc = "0.53"
log = "0.4"
anyhow = "1"

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }

# Relay WebSocket client.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_websocket_client", version = ">=1.2.0" }

# Wi-Fi for the radio-less P4 runs through the onboard ESP32-C6 over esp_hosted;
# Waveshare's own P4 example pulls both with default (SDIO) config.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_hosted", version = "*" }

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_wifi_remote", version = "*" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = "s"
debug = true
