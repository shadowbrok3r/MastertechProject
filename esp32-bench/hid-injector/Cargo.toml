# Own workspace root; keeps this xtensa crate out of the parent workspace.
[workspace]

[package]
name = "hid-injector"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "ESP32-S3 USB HID injector — relay-reachable keyboard + mouse for bench machines"
resolver = "2"

[dependencies]
log = "0.4"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Compiled only for the on-device target; host builds test the pure protocol.
[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-svc = "0.51"

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }

# Pulls the IDF WebSocket client component so `esp_idf_svc::ws::client` builds.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_websocket_client", version = ">=1.2.0" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = "s"
debug = true
