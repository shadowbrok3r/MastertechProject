[package]
name = "websocket_server2"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"]}
tokio-tungstenite = { version = "0.26" }
simplelog = "0.12"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2.5"
uuid = { version = "1", features = ["v4"] }
surrealdb-alpha = { version="2.0.8", features = ["protocol-ws"] }
futures = "0.3"
tokio-cron-scheduler = "0.13.0"
