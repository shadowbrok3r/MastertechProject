[package]
name = "websocket_server2"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = { version = "0.8.3", features = ["ws"]}
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
log = "0.4"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
futures = "0.3"

database = { workspace = true }
