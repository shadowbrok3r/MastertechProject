# cargo-features = ["per-package-target"]

[package]
name = "websocket_server2"
version = "0.1.0"
edition = "2021"
# forced-target = "x86_64-unknown-linux-gnu"Z

[dependencies]
async-trait = "0.1"
axum = { version = "0.7", features = ["ws"]}
tokio-tungstenite = { version = "0.23" }
simplelog = "0.12.2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2.5.1"
uuid = { version = "1", features = ["v4"] }
surrealdb-alpha = { workspace=true }
futures.workspace = true
# [workspace]
