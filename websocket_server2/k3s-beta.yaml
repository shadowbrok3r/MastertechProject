apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocketserver-beta
  namespace: rust
spec:
  selector:
    matchLabels:
      app: websocketserver-beta
  template:
    metadata:
      labels:
        app: websocketserver-beta
    spec:
      nodeSelector:
        kubernetes.io/hostname: ubuntu-server
      containers:
      - name: websocketserver-beta
        image: shadowbrok3r/websocket_server:beta
        imagePullPolicy: Always
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "America/Denver"
        ports:
        - containerPort: 8081
      imagePullSecrets:
      - name: regcred


---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: websocket-beta-ingress
  namespace: rust
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls.certresolver: cloudflare
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-ws-middleware@kubernetescrd
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
spec:
  rules:
  - host: socket.master-tech.app
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: websocketserver-beta
            port:
              number: 80


---

apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ws-middleware
  namespace: kube-system
spec:
  headers:
    customRequestHeaders:
      Connection: "Upgrade"
      Upgrade: "websocket"
    hostsProxyHeaders:
      - "X-Forwarded-Host"
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    forceSTSHeader: true
    frameDeny: true
    contentTypeNosniff: true
    browserXssFilter: true
    customFrameOptionsValue: "ALLOWALL"

--- 

apiVersion: v1
kind: Service
metadata:
  name: websocketserver-beta
  namespace: rust
spec:
  # clusterIPs: []
  clusterIP: None
  # type: NodePort
  selector:
    app: websocketserver-beta
  ports:
  - port: 80
    # nodePort: 30081
    targetPort: 8081
    protocol: TCP