[package]
name = "axum_middleware"
version = "0.1.0"
edition = "2024"

[dependencies]
# The core stuff
database = { workspace=true }
axum = {version = "0.8.3", features=["tracing", "macros", "multipart", "ws"]}
tower-http = { version = "0.6", features = ["full"] }
tokio = { version="1", features=["full"] }
http = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
dotenv="0.15"
tokio-cron-scheduler = {version = "0.13", features = ["english"]}
rmcp = {version = "0.1.5", features = ["server", "transport-sse-server", "transport-io"]}
schemars = "*"


# For logging
log = "0.4"
tracing-subscriber = { version="0.3", features=["env-filter", "json"] }
tracing = "0.1"
uuid = { version = "1.8", features = ["v4", "fast-rng"] }
anyhow = "1"

[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
openssl-sys = "0.9"
