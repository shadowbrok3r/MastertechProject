[package]
name = "backdrop-blur-egui"
version = "0.3.0"
description = "egui adapter for backdrop-blur: frosted glass over two paths sharing one Surface vocabulary — grab-pass (eframe-on-glow, grab the live framebuffer in a paint callback, blur, composite) and own-loop (egui-wgpu, render to an intermediate and composite)."
readme = "README.md"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/abdu-benayad/backdrop-blur"
authors = ["Abdu Benayad <abdu.benayad@gmail.com>"]
keywords = ["blur", "backdrop", "frosted-glass", "vibrancy", "gpu"]
categories = ["graphics", "gui", "rendering", "wasm"]
publish = false

[dependencies]
# Neutral spine — both the own-loop and grab-pass paths need these.
backdrop-blur-core = { path = "../backdrop-blur-core", version = "0.3.0" }
egui = "0.35"
# Own-loop (egui-wgpu) backend deps — optional, activated only by the `own-loop` feature, so a
# grab-pass build pulls neither wgpu nor egui-wgpu. default-features = false keeps winit OUT.
backdrop-blur-wgpu = { path = "../backdrop-blur-wgpu", version = "0.3.0", optional = true }
egui-wgpu = { version = "0.35", default-features = false, optional = true }
wgpu = { version = "29", optional = true }
# Grab-pass (eframe-on-glow) backend deps — optional, activated only by the `grab-pass` feature, so
# an own-loop build pulls neither. Neither pulls wgpu, so a grab-pass build stays wgpu-free.
backdrop-blur-glow = { path = "../backdrop-blur-glow", version = "0.3.0", optional = true }
egui_glow = { version = "0.35", default-features = false, optional = true }
# The adapter names glow::Context in its public API (GrabPassRenderer::new/destroy); pinned to the
# same 0.17 backdrop-blur-glow + egui_glow use, so there is one glow in the graph.
glow = { version = "0.17", optional = true }
# Uncatchable best-effort warning when a grab-pass frost fails inside a paint callback (which cannot
# propagate an error). Optional — only the grab-pass path uses it.
log = { workspace = true, optional = true }

[dev-dependencies]
pollster = "0.4"

[features]
# Fork default: grab-pass, the path MasterTech's eframe-on-glow apps use. Upstream defaults to
# own-loop; flipping it keeps wgpu out of a plain `cargo build` of this workspace.
default = ["grab-pass"]
# The grab-pass path: the eframe-on-glow adapter (GrabPassRenderer). Pulls the glow backend + the
# egui_glow paint-callback integration — neither pulls wgpu.
grab-pass = ["dep:backdrop-blur-glow", "dep:egui_glow", "dep:glow", "dep:log"]
# The own-loop path: the egui-wgpu adapter (OwnLoopRenderer) that renders to an intermediate and
# composites the frosted surface. Pulls the wgpu stack.
own-loop = ["dep:backdrop-blur-wgpu", "dep:egui-wgpu", "dep:wgpu"]
# Gates the GPU tier: a headless lavapipe test that drives real egui-wgpu rendering + blur and
# reads the frosted result back. Hard-imports the wgpu backend, so it requires `own-loop`.
image-snapshots = ["own-loop"]
# Gates the adapter's real-GL control-flow tests (GrabPassRenderer new/destroy/poison/outcome):
# shares backdrop-blur-glow's EGL-surfaceless harness. Test infrastructure, not library API.
gl-snapshots = ["grab-pass", "backdrop-blur-glow/gl-snapshots"]
