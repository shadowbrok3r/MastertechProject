[package]
name = "backdrop-blur-wgpu"
version = "0.3.0"
description = "wgpu backend for backdrop-blur: a safe, WGSL implementation of the frosted-glass seam (separable Gaussian now; dual-Kawase to follow)."
readme = "README.md"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/abdu-benayad/backdrop-blur"
authors = ["Abdu Benayad <abdu.benayad@gmail.com>"]
keywords = ["blur", "backdrop", "frosted-glass", "vibrancy", "gpu"]
categories = ["graphics", "gui", "rendering", "wasm"]
publish = false

[dependencies]
backdrop-blur-core = { path = "../backdrop-blur-core", version = "0.3.0" }
# Pinned to the wgpu egui-wgpu 0.36 resolves, so there is one wgpu in the own-loop graph.
wgpu = "30"
# Derives only — `#[derive(Pod, Zeroable)]`, never `unsafe impl` — so the crate keeps
# `#![forbid(unsafe_code)]`. The GPU-uniform structs live here (not core), per DESIGN S2.
bytemuck = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Spawns the deferred error-scope pop awaits on the browser microtask queue.
wasm-bindgen-futures = "0.4"

[dev-dependencies]
# Block on wgpu's async adapter/device futures in the gated GPU tests.
pollster = "0.4"

[features]
# Gates the GPU tier: tests that build a `wgpu::Device` run only with this feature, on a
# lavapipe host. The default `cargo test` compiles the crate and runs the pure cache-key /
# uniform-layout tests, spinning up no GPU context (the repo's portability invariant).
image-snapshots = []
