services:
  mtechserver:
    image: shadowbrok3r/mtechserver:beta
    build:
      context: .
      dockerfile: ./Dockerfile
    develop:
      watch:
        - action: sync+restart
          path: ./MtechServer2.0
          target: /MtechServer2.0
          # ignore:
          #   - target/
        - action: rebuild
          path: Cargo.toml
    restart: always
    networks:
        - web
    ports:
      - 8080:8080
    expose:
      - 8080
    # volumes:
    #   - "${PWD}:${PWD}"

  websocketserver:
    image: shadowbrok3r/websocket_server:beta
    build:
      context: .
      dockerfile: ./websocket_server2/Dockerfile
    restart: always
    networks:
      - web
    ports:
      - 8081:8081
    expose:
      - 8081

  axumserver:
    image: shadowbrok3r/axum_server:beta
    build:
      context: .
      dockerfile: ./axum_server/Dockerfile
    restart: always
    networks:
      - web
    ports:
      - 8082:8082
    expose:
      - 8082
    environment:
      SERVER_URL: "0.0.0.0"
      SERVER_PORT: "8082"
      RUST_LOG: "mtech_srv=info,axum_server=info"

  pluginbuilder:
    image: shadowbrok3r/plugin_builder:beta
    build:
      context: .
      dockerfile: ./plugin_builder/Dockerfile
    restart: always
    networks:
      - web
    depends_on:
      - websocketserver
    environment:
      # Points at the websocket_server2 service on the shared `web`
      # network. Admin Mastertech4.0 instances reach this worker the
      # same way they reach a customer machine: open a master session
      # to room_id = build_worker_<hostname>.
      MASTERTECH_WS_URL: ws://websocketserver:8081/websocket
      RUST_LOG: plugin_builder=info
    volumes:
      # Persisted across container restarts so:
      #   - cargo-registry-cache: registry index + crate tarballs (huge
      #     time saver across plugins, set via CARGO_HOME in the image).
      #   - mtech-target-cache:   per-plugin CARGO_TARGET_DIR, keeping
      #     incremental compilation hot for repeated rebuilds of the
      #     same plugin during agent iteration.
      - cargo-registry-cache:/var/cache/cargo
      - mtech-target-cache:/var/cache/mtech-builder

volumes:
  cargo-registry-cache:
  mtech-target-cache:

networks:
  web:
    driver: bridge
    name: web