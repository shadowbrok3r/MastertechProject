# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[package]
name = "mastertech_rust_egui"
version = "0.1.0"
edition = "2021"

[build-dependencies]
static_vcruntime = "2.0"

[dependencies]
chrono = "0.4.26"
eframe = "0.22.0"
egui = "0.22.0"
egui_dock = "0.6.3"
egui_extras = {version = "0.22.0", features = ["datepicker"]}
reqwest = {version = "0.11.18", features = ["json", "stream"] }
sysinfo = "0.29.2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0.164", features = ["derive"] }
serde_json = "1.0"
catppuccin-egui = "3.0.0"
futures-util = "0.3.28"
bytes = "1.4.0"
walkdir = "2.3.3"
futures = "0.3.28"
pollster = "0.3.0"
crossbeam = "0.8.2"
asana = "0.1.1"
#opener = "0.6.1"
#directories = "5.0.1"
#jwalk = "0.8.1"
#openssl = { version = "0.10", features = ["vendored"] } #Only on linux
#egui_file = "0.9.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = "debuginfo"


