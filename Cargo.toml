[package]
name = "MtechServer"
version = "0.1.0"
edition = "2021"

[dependencies]
egui = "0.27.2"
wasm-bindgen = "0.2.92"
eframe = { version="0.27.2", features=["persistence", "wgpu"] }
egui_extras = { version = "0.27.2", features = ["datepicker"]}
egui-aesthetix = { version = "0.2.3", features = ["carl"] }
surrealdb = { version = "1.5.0", features = ["default"] }
egui_dock = "0.12.0"
anyhow = "1.0.83"
log = "0.4"
serde = { version = "1", features = ["derive"] }
# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.3"
# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

[profile.release]
opt-level = 2 # fast and small wasm

# Optimize all dependencies even in debug builds:
[profile.dev.package."*"]
opt-level = 2
