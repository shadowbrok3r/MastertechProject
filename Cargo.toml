[workspace]
resolver = "3"
members = [ "database" , "displays", "Mastertech4.0" ]

[workspace.dependencies]
database = { path = "database" }
eframe = { version="0.34", features=["serde",  "default_fonts", "glow"], default-features=false } 
ratatui = { version = "0.30", default-features = true, features = [ "crossterm", "unstable", "serde" ]}
surrealdb = { version = "3.0.5", features = ["protocol-ws"] }
surrealdb-types = { version = "3.0.5" }
egui_extras = { version = "0.34", features = ["datepicker", "syntect", "serde", "image", "all_loaders" ]}
egui-data-table = { git = "https://github.com/shadowbrok3r/egui-data-table", features = ["persistency"]}
egui_json_tree = { version = "0.15", features = ["serde_json"] }
egui_dock = { git = "https://github.com/shadowbrok3r/egui_dock",  features = [ "serde" ] }
rmcp = { version = "1.3.0", features = ["server", "client", "transport-async-rw", "transport-streamable-http-server"] }
axum = { version = "0.8.3", default-features = true, features = ["tokio"] }
chrono = { version = "0.4", default-features = false, features = ["now"] } 
tokio = { version = "1.50.0", features = ["full", "tracing"] }
async-openai-wasm = { version = "0.29.5" }
async-openai = { version = "0.29.5" } # , features = ["response-types"] }
image = { version = "0.25", features = ["jpeg", "png", "gif"] }
structdiff = {version = "0.7", features = ["rustc_hash"]}
bincode = { version="2", features = ["serde", "derive"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
gloo-console = "0.4.0"
wasm-cookies = "0.2"
web-time = "1"
egui_plot = "0.35.0"
lazy_static = "1"
log="0.4"
serde_json = "1"
anyhow = "1"
dotenvy = "0.15.7"
mime_guess = "2"
crossbeam = "0.8"
futures = "0.3"
fuzzy-matcher = "0.3"
rusty-s3 = "0.9.0"
wasmtime = "43"
wasmtime-wasi = "43"
wat = "1.222.0"
rfd = "0.17.2"
regex = "1.12"
async-trait = "0.1"
once_cell = "1"
simplelog = "0.12.2"
bytes = "1.11"
brotli = "8.0.2"
base64 = "0.22"
itertools = "0.14"

[profile.dev]
debug = true
strip = false
lto = false

[profile.release] # YOU NEED TO DISABLE 'STRIP = true' WHEN PUSHING WASM TO PRODUCTION
strip = true
lto = true
panic = "unwind"
debug = false
opt-level = 3
codegen-units = 1

# [profile.wasm-release] # trunk build --release --profile wasm-release
