[workspace]
resolver = "2"
members=[ "frontend", "database" ] #  , "websocket_server"


[workspace.dependencies]
database = { path = "database" }
serde = { version = "1", features = ["derive"] }
surrealdb = { version = "1.5", features = ["protocol-ws"] } # kv-speedb "protocol-http", "native-tls"
# surrealdb-alpha = { version = "2", features = ["protocol-ws"] }
anyhow = "1"
log="0.4"
chrono = "0.4"
