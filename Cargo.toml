[workspace]
resolver = "2"
members = [ "Mastertech4.0", "MtechServer2.0", "database" ]
# members=[ "frontend", "database" ] #  , "websocket_server"
# exclude = ["websocket_server"]
# package.exclude = ["websocket_server"]

[workspace.dependencies]
eframe = { version="0.28", features=["persistence", "serde", "wgpu", "default_fonts"] } # wgpu
egui_extras = { version = "0.28", features = ["datepicker"]}
surrealdb = { version = "1.5", features = ["protocol-ws"] } # kv-speedb "protocol-http", "native-tls"
egui_dock = { version = "0.13", features = ["serde"]}
tokio = { version = "1.38", features = ["full", "tracing"] }
serde = { version = "1", features = ["derive"] }
database = { path = "database" }
ratatui = { version = "0.27", default-features = false }
log="0.4"
chrono = "0.4"
dotenv = "0.15"
serde_json = "1"
anyhow = "1"
ratframe = "1"
crossbeam = "0.8"
futures = "0.3"
egui_ratatui = "0.0.10" # Note: Version is slightly different but `egui_ratatui` is common
fuzzy-matcher = "0.3"
uuid = { version = "1.10", features = ["v4"] } # Note: Version is slightly different but `uuid` is common
bincode = "1.3"
rfd = "0.14"
regex = "1.10"
async-trait = "0.1"
once_cell = "1.19.0"
simplelog = "0.12"
