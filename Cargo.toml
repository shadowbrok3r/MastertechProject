[package]
name = "MasterTech"
version = "4.0.5"
edition = "2021"
description = "Mastertech"
build = "build.rs"

[target.'cfg(target_os = "windows")'.build-dependencies]
static_vcruntime = "2.0"
embed-resource = "2.2.0"

[package.metadata]
icon = ["D:/Users/Owner/Documents/GitHub/Mastertech4.0/src/assets/masterlogoV2.ico"]
resources = ["src/assets/**/*png", "src/assets/**/*ico"]


[dependencies]
chrono = "0.4.26"
eframe = { version="0.22.0", features=["persistence", "puffin"] } #"wgpu"
egui = "0.22.0"
egui_dock = "0.6.3"
egui_extras = { version = "0.22.0", features = ["datepicker"]}
reqwest = { version = "0.11.18", features = ["json", "stream", "blocking"] }
sysinfo = "0.29.2"
tokio = { version = "1.32.0", features = ["full"] }
serde = { version = "1.0.164", features = ["derive"] }
serde_json = "1.0"
catppuccin-egui = "3.0.0"
futures-util = "0.3.28"
bytes = "1.4.0"
walkdir = "2.3.3"
futures = "0.3.28"
pollster = "0.3.0"
crossbeam = "0.8.2"
asana = "0.1.1"
regex = "1.9.1"
image = "0.24.6"
egui_file = "0.10.0"
self_update = "0.38.0"
puffin = { version = "0.16.0", features = ["packing"] }

num-format = "0.4.4"
fs_extra = "1.3.0"
cached = "0.45.1"
log = "0.4.20"
simplelog = "0.12.1"
rayon = "1.7.0"

memmap2 = "0.5.10"
breakpad-symbols = { version = "0.17.0" }
minidump = { version = "0.17.0" }
minidump-common = { version = "0.17.0" }
minidump-processor = { version = "0.17.0", features = ["http", "dump_syms"] }

num-traits = "0.2.15"
rfd = "0.11.4"
tempfile = "3.3.0"
tracing = { version = "0.1.34", features = ["log"] }
tracing-subscriber = "0.3.14"
linked-hash-map = "0.5.6"
clap = { version = "4.4.2", features = ["derive"] }
minidump-unwind = "0.17.0"
win_dbg_logger = "0.1.0"
puffin_egui = "0.22.0"
# env_logger = "0.10.0"

[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
libatasmart = "0.3.1"


[package.metadata.winres]
OriginalFilename = "Mastertech.EXE"
LegalCopyright = "Copyright © 2023"

[profile.release]
strip = "debuginfo"

# [profile.dev]
# opt-level = 2

