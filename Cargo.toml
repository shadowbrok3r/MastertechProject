[workspace]
resolver = "2"
members = [ "MtechServer2.0", "database" , "displays", "Mastertech4.0"] #  , "axum_middleware", "websocket_server", "websocket_server2"  

[workspace.dependencies]
database = { path = "database" }
eframe = { version="0.30", features=["persistence", "serde",  "default_fonts", "glow"], default-features=false }
egui_extras = { version = "0.30", features = ["datepicker", "syntect", "serde", "image" ]}
egui_plot = "0.30"
image = { version = "0.25.5", features = ["jpeg", "png"] }
surrealdb = { version = "=2.1.4", features = ["protocol-ws"] } 
egui_dock = { git="https://github.com/bryceberger/egui_dock.git", rev = "4ea4ba1", features = ["serde"]} # version = "0.14"
serde = { version = "1", features = ["derive"] }
ratatui = { version = "0.29", default-features = false }
structdiff = {version = "0.7.1", features = ["rustc_hash"]}
egui_json_tree = "0.10"
log="0.4"
serde_json = "1"
anyhow = "1"
ratframe = "1"
mime_guess = "2"
crossbeam = "0.8"
futures = "0.3.31"
fuzzy-matcher = "0.3"
rusty-s3 = "0.7"
uuid = { version = "1.11", features = ["v4"] } 
bincode = "1.3"
rfd = "0.15.1"
regex = "1.11.1"
async-trait = "0.1.83"
once_cell = "1.20.2"
simplelog = "0.12.2"
bytes = "1.9.0"
gloo-console = "0.3.0"
egui_struct = "0.4"
wasm-bindgen = "0.2"
web-time = "1"
wasm-bindgen-futures = "0.4"
brotli = "7.0.0"
base64 = "0.22"
tokio = { version = "1", features = ["full", "tracing"] }
chrono = { version = "0.4", default-features = false, features = ["now"] } # features = ["now", "wasmbind", "wasm-bindgen", "js-sys"]
async-openai-wasm = { version = "0.26" }
async-openai = {version = "0.26"}


[profile.dev]
debug = true
strip = false
# lto = true

[profile.release]
# strip = true
# debug = false
# opt-level = 3
lto = true

# Optimize all dependencies even in debug builds:
# [profile.dev.package."*"]
# opt-level = 2

# [patch.crates-io]
# arrayvec = "=0.7.6"
# [patch.crates-io]
# rayon = "1.10.0"
# rayon-core = "1.10"
# rayon-core-wasm = "1.10"

[overrides]
arrayvec = "0.7.6"
