[package]
name = "MasterTech"
version = "4.0.5"
edition = "2021"
description = "Mastertech"
build = "build.rs"

[target.'cfg(target_os = "windows")'.build-dependencies]
static_vcruntime = "2.0"
embed-resource = "2.2.0"

[package.metadata]
icon = ["D:/Users/Owner/Documents/GitHub/Mastertech4.0/src/assets/masterlogoV2.ico"]
resources = ["src/assets/**/*png", "src/assets/**/*ico"]

[package.metadata.winres]
OriginalFilename = "Mastertech.EXE"
LegalCopyright = "Copyright © 2023"

[profile.release]
strip = "debuginfo"

[features]
default=["winit", "cpu_fix"]
winit = ["dep:egui-winit"]
compat_mode = ["dep:egui_skia", "dep:egui-winit", "dep:softbuffer", "dep:skia-safe"]
cpu_fix = []

[dependencies]
chrono = "0.4.31"
eframe = { version="0.24.1", features=["persistence", "puffin", "wgpu"] } #
egui = "0.24.1"
egui_dock = "0.9.1"
egui_extras = { version = "0.24.1", features = ["datepicker"]}
reqwest = { version = "0.11.20", features = ["json", "stream", "blocking"] }
sysinfo = "0.29.10"
tokio = { version = "1.32.0", features = ["full"] }
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0.107"
catppuccin-egui = "3.1.0"
futures-util = "0.3.28"
bytes = "1.5.0"
walkdir = "2.4.0"
futures = "0.3.28"
pollster = "0.3.0"
crossbeam = "0.8.2"
asana = "0.1.1"
regex = "1.9.5"
image = "0.24.7"
egui_file = "0.13.0"
self_update = "0.39.0"
puffin = { version = "0.18.0", features = ["packing"] }
puffin_egui = "0.24.0"

num-format = "0.4.4"
fs_extra = "1.3.0"
simplelog = "0.12.1"
log = "0.4.20"
rayon = "1.8.0"

memmap2 = "0.5.10"
breakpad-symbols = { version = "0.18.0" }
minidump = { version = "0.18.0" }
minidump-common = { version = "0.18.0" }
minidump-processor = { version = "0.18.0", features = ["http", "dump_syms"] }

num-traits = "0.2.16"
rfd = "0.12.0"
tracing = { version = "0.1.37", features = ["log"] }
tracing-subscriber = "0.3.14"
linked-hash-map = "0.5.6"
clap = { version = "4.4.4", features = ["derive"] }
minidump-unwind = "0.19.1"

egui_skia = { version = "0.4.0", features = ["winit", "cpu_fix"], optional = true}
egui-winit = { version = "0.24.1", optional = true, default-features = false }
softbuffer = {version = "0.4.0", optional = true}
skia-safe = {version = "0.69.0", optional = true}
dotenv = "0.15.0"
lettre = "0.11.2"
async-trait = "0.1.74"
egui-aesthetix = { version = "0.2.0", features = [ "carl" ] }
xml = "0.8.10"


[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
libatasmart = "0.3.1"

# [profile.dev]
# opt-level = 2

# [profile.dev.package."*"]
# opt-level = 3

