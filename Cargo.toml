[package]
name = "MasterTech"
version = "4.0.5"
edition = "2021"
description = "Mastertech"
build = "build.rs"

[target.'cfg(target_os = "windows")'.build-dependencies]
static_vcruntime = "2.0"
embed-resource = "2.4.2"

[package.metadata]
icon = ["D:/Users/Owner/Documents/GitHub/Mastertech4.0/src/assets/masterlogoV2.ico"]
resources = ["src/assets/**/*png", "src/assets/**/*ico"]

[package.metadata.winres]
OriginalFilename = "Mastertech.EXE"
LegalCopyright = "Copyright © 2023"

[profile.release]
# strip = "debuginfo"
debug = true

[features]
default=["winit", "cpu_fix"]
winit = ["dep:egui-winit"]
compat_mode = ["dep:egui_skia", "dep:egui-winit", "dep:softbuffer", "dep:skia-safe"]
cpu_fix = []

[dependencies]
chrono = "0.4.31"
eframe = { version="0.27.2", features=["persistence", "puffin", "wgpu"] } #
egui = { version = "0.27.2" } # , features = ["callstack"]"deadlock_detection"
egui_dock = "0.12.0"
egui_extras = { version = "0.27.2", features = ["datepicker"]}
reqwest = { version = "0.12.4", features = ["json", "stream", "blocking", "cookies"] }
sysinfo = "0.30.7"
tokio = { version = "1.36.0", features = ["full"] }
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0.107"
catppuccin-egui = "5.0.0"
futures-util = "0.3.28"
bytes = "1.5.0"
walkdir = "2.4.0"
futures = "0.3.28"
pollster = "0.3.0"
crossbeam = "0.8.2"
regex = "1.9.5"
image = "0.25.0"
egui_file = "0.17.0"
self_update = "0.40.0"
puffin = { version = "0.19.0", features = ["packing"] }
puffin_egui = "0.27.0"
uuid = { version = "1.7.0", features = ["v4"] }

num-format = "0.4.4"
fs_extra = "1.3.0"
simplelog = "0.12.1"
log = "0.4.20"
rayon = "1.8.0"
quick-xml = { version="0.31.0", features = ["serialize"]}

# memmap2 = "0.9.4"
# breakpad-symbols = { version = "0.21.1" }
# minidump = { version = "0.21.1" }
# minidump-common = { version = "0.21.1" }
# minidump-processor = { version = "0.21.1", features = ["http", "dump_syms"] }

num-traits = "0.2.16"
rfd = "0.14.0"
tracing = { version = "0.1.37", features = ["log"] }
tracing-subscriber = "0.3.14"
linked-hash-map = "0.5.6"
clap = { version = "4.4.4", features = ["derive"] }
minidump-unwind = "0.21.1"

egui_skia = { version = "0.4.0", features = ["winit", "cpu_fix"], optional = true}
egui-winit = { version = "0.27.2", optional = true, default-features = false }
softbuffer = {version = "0.4.0", optional = true}
skia-safe = {version = "0.73.0", optional = true}
dotenv = "0.15.0"
lettre = "0.11.2"
async-trait = "0.1.74"
egui-aesthetix = { version = "0.2.0", features = [ "carl" ] }
shell-words = "1.1.0"
rust_socketio = { version = "0.6.0", features = ["async"] }
reqwest_cookie_store = "0.7.0"
anyhow = "1.0.81"


[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
libatasmart = "0.3.1"

# [profile.dev]
# opt-level = 2

# [profile.dev.package."*"]
# opt-level = 3

