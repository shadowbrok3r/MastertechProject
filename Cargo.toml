[workspace]
resolver = "3"
# All buildable crates are permanent members. Do NOT comment entries in/out to
# scope a build — select packages with `cargo build -p <crate>` instead.
members = [
    "database",
    "displays",
    "mtech-ui",
    "mtech-tui",
    "tcp_protocol",
    "stress-kit",
    "stress-runner",
    "axum_server",
    "plugin_builder",
    "websocket_server2",
    "database-tools",
    "Mastertech4.0",
    "qc-app",
    "MtechServer2.0",
]
# Targets of bare `cargo build`/`check`/`test` and rust-analyzer. Excludes the
# wasm-only MtechServer2.0 (cdylib) so native commands don't try to compile it;
# build it with trunk or `cargo build -p mtechserver --target wasm32-unknown-unknown`.
default-members = [
    "database",
    "displays",
    "mtech-ui",
    "mtech-tui",
    "tcp_protocol",
    "stress-kit",
    "stress-runner",
    "axum_server",
    "plugin_builder",
    "websocket_server2",
    "database-tools",
    "Mastertech4.0",
    "qc-app",
]
# Standalone crates with their own toolchain/target; never part of this resolve.
# uefi has its own [workspace] and builds standalone. MastertechMobile still
# inherits workspace deps (incl. database) and needs its own [workspace.dependencies]
# before it builds outside this workspace.
exclude = [
    "uefi",
    "MastertechMobile",
]

[workspace.dependencies]
stress-kit = { path = "stress-kit" }
stress-runner = { path = "stress-runner" }
mtech-ui = { path = "mtech-ui" }
mtech-tui = { path = "mtech-tui" }
database = { path = "database" }
tcp_protocol = { path = "tcp_protocol" }
eframe = { version="0.34", features=["serde",  "default_fonts", "glow"], default-features=false } 
ratatui = { version = "0.30", default-features = true, features = [ "crossterm", "unstable", "serde", "layout-cache" ]}
surrealdb = { version = "3.2.0-beta.1", features = ["protocol-ws"] }
surrealdb-types = { version = "3.2.0-beta.1" }
egui_extras = { version = "0.34", features = ["datepicker", "syntect", "serde", "image", "all_loaders" ]}
egui-data-table = { git = "https://github.com/shadowbrok3r/egui-data-table", features = ["persistency"]}
egui_json_tree = { version = "0.15", features = ["serde_json"] }
egui_dock = { git = "https://github.com/shadowbrok3r/egui_dock",  features = [ "serde" ] }
rmcp = { version = "1.8.0", features = ["server", "client", "transport-async-rw", "transport-streamable-http-server"] }
axum = { version = "0.8", default-features = true, features = ["tokio"] }
chrono = { version = "0.4", default-features = false, features = ["now"] } 
tokio = { version = "1", features = ["full", "tracing"] }
async-openai = { version = "0.41.1", features = ["full"] }
image = { version = "0.25", features = ["jpeg", "png", "gif"] }
structdiff = {version = "0.7", features = ["rustc_hash"]}
bincode = { version="2", features = ["serde", "derive"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

wasm-bindgen-futures = "0.4.75"
# Exact pin: trunk selects wasm-bindgen-cli from the locked version; a caret
# would float to 0.2.126+ whose CLI release artifact 404s until it's published.
wasm-bindgen = "=0.2.125"
# 0.4 requires js-sys ^0.3.91; surrealdb 3.1.0-beta.2 pins wasm-bindgen-futures 0.4.58 → js-sys 0.3.85.
gloo-console = "0.3"
wasm-cookies = "0.2"
web-time = "1"
egui_plot = "0.35.0"
lazy_static = "1"
log="0.4"
serde_json = "1"
anyhow = "1"
dotenvy = "0.15.7"
mime_guess = "2"
crossbeam = "0.8"
futures = "0.3"
fuzzy-matcher = "0.3"
rusty-s3 = "0.10.0"
wasmtime = "46.0.1"
wasmtime-wasi = "46.0.1"
wat = "1.2"
rfd = "0.17.2"
regex = "1.12"
async-trait = "0.1"
once_cell = "1"
simplelog = "0.12.2"
bytes = "1.12.0"
brotli = "8.0.4"
base64 = "0.22"
itertools = "0.15.0"

[profile.dev]
debug = true
strip = false
lto = false

[profile.release] # YOU NEED TO DISABLE 'STRIP = true' WHEN PUSHING WASM TO PRODUCTION
strip = true
lto = true
panic = "unwind"
debug = false
opt-level = 3
codegen-units = 1

# Compile with: cargo build -p MasterTech --profile release-fast
# Inherits all release semantics (cfg(debug_assertions) = false, production DB URLs, etc.)
# skips LTO and uses more codegen units for faster incremental rebuilds.
[profile.release-fast]
inherits = "release"
lto = false            # no link-time optimisation (biggest time saver)
codegen-units = 16     # more parallel codegen units; trades binary size for speed
opt-level = 2          # slightly faster than 3 to compile; runtime cost is negligible
strip = false          # keep symbols for legible stack traces during testing
debug = false          # no debug info (keeps binary small)
incremental = true     # cache unchanged crates between rebuilds

# [profile.wasm-release] # trunk build --release --profile wasm-release
# inherits = "release"
# strip = false  # Disable strip just for this profile