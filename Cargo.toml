[workspace]
resolver = "2"
members = [ "MtechServer2.0", "database" , "displays", "Mastertech4.0"] #  , "websocket_server", "websocket_server2"  

[workspace.dependencies]
database = { path = "database" }
eframe = { version="=0.29.1", features=["persistence", "serde",  "default_fonts", "accesskit", "glow"], default-features=false }
egui_extras = { version = "0.29.1", features = ["datepicker", "syntect", "serde" ]}
surrealdb = { version = "2.0.4", features = ["protocol-ws"] } 
egui_dock = { version = "0.14", features = ["serde"]}
tokio = { version = "1", features = ["full", "tracing"] }
serde = { version = "1", features = ["derive"] }
ratatui = { version = "0.29", default-features = false }
structdiff = {version = "0.7", features = ["rustc_hash"]}
wasm-bindgen = "0.2"
web-time = "1"
wasm-bindgen-futures = "0.4"
egui_json_tree = "0.7.1"
log="0.4"
chrono = "0.4"
dotenv = "0.15"
serde_json = "1"
anyhow = "1"
ratframe = "1"
mime_guess = "2"
crossbeam = "0.8"
futures = "0.3"
fuzzy-matcher = "0.3"
uuid = { version = "1.11", features = ["v4"] } 
bincode = "1.3"
rfd = "0.15.0"
regex = "1.11.0"
async-trait = "0.1"
once_cell = "1.20"
simplelog = "0.12"
bytes = "1.8"
gloo-console = "0.3.0"
egui_struct = "0.4"

[profile.dev]
debug = true
lto = false
strip = false

[profile.release]
strip = "debuginfo"
debug = false
opt-level = 3


# Optimize all dependencies even in debug builds:
[profile.dev.package."*"]
opt-level = 2
