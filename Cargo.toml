[workspace]
resolver = "3"
# All buildable crates are permanent members. Do NOT comment entries in/out to
# scope a build — select packages with `cargo build -p <crate>` instead.
members = [
    "database",
    "displays",
    "mtech-ui",
    "mtech-tui",
    "tcp_protocol",
    "stress-kit",
    "stress-runner",
    "axum_server",
    "plugin_builder",
    "websocket_server2",
    "database-tools",
    "Mastertech4.0",
    "admin-agent",
    "qc-app",
    "MtechServer2.0",
    "pxe-bench",
    "dump-triage",
    "mtech-plugin-sdk",
    "bioslove-index",
    "esp-image",
    # Vendored fork of https://github.com/abdu-benayad/backdrop-blur, ported to egui 0.35.
    "backdrop-blur/crates/backdrop-blur-core",
    "backdrop-blur/crates/backdrop-blur-glow",
    "backdrop-blur/crates/backdrop-blur-egui",
    "backdrop-blur/crates/backdrop-blur-wgpu",
    "backdrop-blur/examples/eframe-glow-panel",
]
# Targets of bare `cargo build`/`check`/`test` and rust-analyzer. Excludes the
# wasm-only MtechServer2.0 (cdylib) so native commands don't try to compile it;
# build it with trunk or `cargo build -p mtechserver --target wasm32-unknown-unknown`.
# Also excludes backdrop-blur-wgpu: nothing here uses the own-loop path, and building
# it would pull the whole wgpu 29 + naga stack into every bare `cargo check`.
default-members = [
    "database",
    "displays",
    "mtech-ui",
    "mtech-tui",
    "tcp_protocol",
    "stress-kit",
    "stress-runner",
    "axum_server",
    "plugin_builder",
    "websocket_server2",
    "database-tools",
    "Mastertech4.0",
    "admin-agent",
    "qc-app",
    "pxe-bench",
    "dump-triage",
    "mtech-plugin-sdk",
    "bioslove-index",
    "esp-image",
    "backdrop-blur/crates/backdrop-blur-core",
    "backdrop-blur/crates/backdrop-blur-glow",
    "backdrop-blur/crates/backdrop-blur-egui",
]
# Standalone crates with their own toolchain/target; never part of this resolve.
# uefi has its own [workspace] and builds standalone. MastertechMobile still
# inherits workspace deps (incl. database) and needs its own [workspace.dependencies]
# before it builds outside this workspace.
exclude = [
    "uefi",
    "MastertechMobile",
    "preboot-relay",
    "mtech-plugin-sdk/examples/minimal_guest",
]

# Shipped MasterTech release version. `displays` and `Mastertech4.0` inherit it so
# the build version the agent reports over the wire matches the app it ships in.
[workspace.package]
version = "4.8.0"

[workspace.dependencies]
backdrop-blur-core = { path = "backdrop-blur/crates/backdrop-blur-core" }
backdrop-blur-glow = { path = "backdrop-blur/crates/backdrop-blur-glow" }
backdrop-blur-egui = { path = "backdrop-blur/crates/backdrop-blur-egui", default-features = false, features = ["grab-pass"] }
dump-triage = { path = "dump-triage" }
mtech-plugin-sdk = { path = "mtech-plugin-sdk" }
facet = "=0.46.5"
stress-kit = { path = "stress-kit" }
stress-runner = { path = "stress-runner" }
mtech-ui = { path = "mtech-ui" }
mtech-tui = { path = "mtech-tui" }
database = { path = "database" }
tcp_protocol = { path = "tcp_protocol" }
eframe = { version="0.36", features=["serde",  "default_fonts", "glow", "links"], default-features=false }
ratatui = { version = "0.30", default-features = true, features = [ "crossterm", "unstable", "serde", "layout-cache" ]}
surrealdb = { version = "3.3.0-beta.2", features = ["protocol-ws"] }
surrealdb-types = { version = "3.3.0-beta.2" }
egui_extras = { version = "0.36", features = ["datepicker", "syntect", "serde", "image", "all_loaders" ]}
egui-data-table = { git = "https://github.com/shadowbrok3r/egui-data-table", features = ["persistency"]}
# Fork: crates.io 0.16.0 is the newest release and it only compiles against egui 0.35.
egui_json_tree = { git = "https://github.com/shadowbrok3r/egui_json_tree", features = ["serde_json"] }
egui_dock = { git = "https://github.com/shadowbrok3r/egui_dock",  features = [ "serde" ] }
rmcp = { version = "3.1.3", features = ["server", "client", "transport-async-rw", "transport-streamable-http-server"] }
axum = { version = "0.8", default-features = true, features = ["tokio"] }
chrono = { version = "0.4", default-features = false, features = ["now"] } 
chrono-tz = "0.10"
tokio = { version = "1", features = ["full", "tracing"] }
async-openai = { version = "0.41.1", features = ["full"] }
image = { version = "0.25", features = ["jpeg", "png", "gif"] }
structdiff = {version = "0.7", features = ["rustc_hash"]}
bincode = { version="2", features = ["serde", "derive"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

wasm-bindgen-futures = "0.4.75"
# Exact pin: trunk selects wasm-bindgen-cli from the locked version, so this must
# name a version with a published CLI release artifact. eframe 0.36 requires >=0.2.126.
wasm-bindgen = "=0.2.126"
# 0.4 requires js-sys ^0.3.91; surrealdb 3.1.0-beta.2 pins wasm-bindgen-futures 0.4.58 → js-sys 0.3.85.
gloo-console = "0.3"
wasm-cookies = "0.2"
web-time = "1"
egui_plot = "0.37.0"
lazy_static = "1"
log="0.4"
serde_json = "1"
anyhow = "1"
dotenvy = "0.15.7"
mime_guess = "2"
crossbeam = "0.8"
futures = "0.3"
fuzzy-matcher = "0.3"
wasmtime = "47.0.2"
wasmtime-wasi = "47.0.2"
wat = "1"
rfd = "0.17.2"
regex = "1.13.0"
async-trait = "0.1"
once_cell = "1"
simplelog = "0.12.2"
bytes = "1.12.0"
brotli = "8.0.4"
base64 = "0.23.0"
itertools = "0.15.0"

[profile.dev]
debug = true
strip = false
lto = false

[profile.release] # YOU NEED TO DISABLE 'STRIP = true' WHEN PUSHING WASM TO PRODUCTION
strip = true
lto = true
panic = "unwind"
debug = false
opt-level = 3
codegen-units = 1

# Compile with: cargo build -p MasterTech --profile release-fast
# Add --features skia-render to include the egui_skia software renderer; see
# Mastertech4.0/BUILD.md for the required env vars (SKIA_NINJA_COMMAND, CARGO_TARGET_DIR) on Windows.
# Inherits all release semantics (cfg(debug_assertions) = false, production DB URLs, etc.)
# skips LTO and uses more codegen units for faster incremental rebuilds.
[profile.release-fast]
inherits = "release"
lto = false            # no link-time optimisation (biggest time saver)
codegen-units = 16     # more parallel codegen units; trades binary size for speed
opt-level = "z"          # slightly faster than 3 to compile; runtime cost is negligible
strip = false          # keep symbols for legible stack traces during testing
debug = false          # no debug info (keeps binary small)
incremental = true     # cache unchanged crates between rebuilds

# [profile.wasm-release] # trunk build --release --profile wasm-release
# inherits = "release"
# strip = false  # Disable strip just for this profile

[patch.crates-io]
egui-phosphor = { git = "https://github.com/shadowbrok3r/egui-phosphor", branch = "egui-036" }