[workspace]
resolver = "2"
members = [ "MtechServer2.0", "database" , "displays", "Mastertech4.0"] #  , "Mastertech4.0", "websocket_server", "websocket_server2"  

[workspace.dependencies]
database = { path = "database" }
eframe = { version="=0.29.1", features=["persistence", "serde",  "default_fonts", "accesskit", "glow"], default-features=false }
egui_extras = { version = "0.29.1", features = ["datepicker", "syntect", "serde", "image" ]}
image = { version = "0.25.5", features = ["jpeg", "png"] }
surrealdb = { version = "=2.1.2", features = ["protocol-ws"] } 
egui_dock = { version = "0.14", features = ["serde"]}
serde = { version = "1", features = ["derive"] }
ratatui = { version = "0.29", default-features = false }
structdiff = {version = "0.7.1", features = ["rustc_hash"]}
egui_json_tree = "0.8"
log="0.4"
serde_json = "1"
anyhow = "1"
ratframe = "1"
mime_guess = "2"
crossbeam = "0.8"
futures = "0.3.31"
fuzzy-matcher = "0.3"
uuid = { version = "1.11", features = ["v4"] } 
bincode = "1.3"
rfd = "0.15.1"
regex = "1.11.1"
async-trait = "0.1.83"
once_cell = "1.20.2"
simplelog = "0.12.2"
bytes = "1.9.0"
gloo-console = "0.3.0"
egui_struct = "0.4"
wasm-bindgen = "0.2"
web-time = "1"
wasm-bindgen-futures = "0.4"
brotli = "7.0.0"
base64 = "0.22"
tokio = { version = "1", features = ["full", "tracing"] }
chrono = { version = "0.4", default-features = false, features = ["now"] } # features = ["now", "wasmbind", "wasm-bindgen", "js-sys"]

[profile.dev]
debug = true
strip = false
# lto = true

[profile.release]
# strip = "debuginfo"
# debug = false
# opt-level = 3
lto = true

# Optimize all dependencies even in debug builds:
# [profile.dev.package."*"]
# opt-level = 2

# [patch.crates-io]
# arrayvec = "=0.7.6"
[overrides]
arrayvec = "0.7.6"
# libc = { git = "https://github.com/wasix-org/libc", branch = "master" }
# tokio = { git = "https://github.com/wasix-org/tokio", branch = "wasix-1.24.2" }

