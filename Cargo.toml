[package]
name = "MasterTech"
version = "4.1.4"
edition = "2021"
description = "Mastertech"
build = "build.rs"

[dependencies]
eframe = { version="0.27", features=["persistence", "puffin", "wgpu"] } # "deadlock_detection", "callstack"
egui_dock = "0.12"
egui_extras = { version = "0.27", features = ["datepicker"]}
reqwest = { version = "0.12", features = ["json", "stream", "cookies"] } # "blocking",
sysinfo = "0.30"
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
serde_json = "1"
futures-util = "0.3"
walkdir = "2.5"
pollster = "0.3"
crossbeam = "0.8"
regex = "1.10"
image = "0.25"
egui_file = "0.17"
self_update = "0.40"
puffin = { version = "0.19", features = ["packing"] }
puffin_egui = "0.27"
uuid = { version = "1.8", features = ["v4"] }
futures = "0.3"
num-format = "0.4"
fs_extra = "1.3"
simplelog = "0.12"
log = "0.4"
rayon = "1.10"
quick-xml = { version="0.35.0", features = ["serialize"]}
serde-xml-rs = "0.6"
num-traits = "0.2"
rfd = "0.14"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = "0.3"
rust-embed="8.4"
clap = { version = "4.5", features = ["derive"] }
dotenv = "0.15"
lettre = "0.11"
async-trait = "0.1"
egui-aesthetix = { version = "0.2", features = ["carl"] }
shell-words = "1"
reqwest_cookie_store = "0.8"
anyhow = "1"
sha2 = { version = "0.10", features = ["std"] }
wmi = "0.13"
surrealdb = { version = "1.5", features = ["default"] }
# surrealdb-alpha = { version = "2", features = ["default"] }

quickxml_to_serde = "0.6"

memmap2 = "0.9"
breakpad-symbols = { version = "0.21" }
minidump = { version = "0.21" }
minidump-common = { version = "0.21" }
minidump-processor = { version = "0.21", features = ["http"] }
minidump-unwind = "0.21"
linked-hash-map = "0.5"
ewebsock = {version = "0.6", features = [ "tls" ]}

# bytes = "1.6.0"
# catppuccin-egui = "5.1.1"
# egui_skia = { version = "0.4.0", features = ["winit", "cpu_fix"], optional = true}
# egui-winit = { ver1.0.86 "0.27.2", optional = true, default-features = false }
# softbuffer = {version = "0.4.2", optional = true}
# skia-safe = {version = "0.73.0", optional = true}
# portable-pty = "0.8.1"
ratatui = {version = "0.27.0", features = ["crossterm"]}
ratframe = "1"
egui_ratatui = "0.0.8"
tui-input = "0.9.0"
crossterm = "0.27.0"
hex = "0.4.3"
bincode = "1.3.3"
fuzzy-matcher = "0.3.7"
ring = "0.17.8"
# tui-term = "0.1.11"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"]}

[[bench]]
name = "file_copy_benchmark"
harness = false


# [target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
openssl-sys = "0.9"
# libatasmart = "0.3.1"

# [features]
# default=["winit"]   # , "cpu_fix", "compat_mode"
# winit = ["dep:egui-winit"]
# compat_mode = ["dep:egui_skia", "dep:egui-winit", "dep:softbuffer", "dep:skia-safe"]
# cpu_fix = []

[profile.release]
strip = "debuginfo"
debug = false
opt-level = 3

# [profile.dev]
# debug = true
# lto = false
# strip = false

[target.'cfg(target_os = "windows")'.build-dependencies]
static_vcruntime = "2"
embed-resource = "2.4"

[package.metadata]
icon = ["D:/Users/Owner/Documents/GitHub/Mastertech4.0/src/assets/masterlogoV2.ico"]
resources = ["src/assets/**/*png", "src/assets/**/*ico"]

[package.metadata.winres]
OriginalFilename = "Mastertech.EXE"
LegalCopyright = "Copyright © 2024"
