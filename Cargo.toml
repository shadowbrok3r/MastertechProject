[workspace]
resolver = "3"
members = [ "database" , "displays", "MtechServer2.0", "done_shelf_audit" ] #  , "Mastertech4.0"
exclude = ["surrealdb"]

[workspace.dependencies]
database = { path = "database" }
eframe = { version="0.33", features=["serde",  "default_fonts", "glow"], default-features=false } # ratatui = { version = "0.29", features = ["crossterm", "unstable-widget-ref", "serde", "underline-color", "widget-calendar"] }
ratatui = { version = "0.30", default-features = true, features = [ "crossterm", "unstable", "serde" ]}
surrealdb = { git = "https://github.com/surrealdb/surrealdb", tag = "v3.0.0-beta.1", features = ["protocol-ws"] }  # surrealdb-alpha = {version = "3.0.6", features = ["protocol-ws"]}
egui_extras = { version = "0.33", features = ["datepicker", "syntect", "serde", "image", "all_loaders" ]}
egui-data-table = { git = "https://github.com/shadowbrok3r/egui-data-table", features = ["persistency"]}
egui_json_tree = { git = "https://github.com/shadowbrok3r/egui_json_tree", features = ["serde_json"] }
egui_dock = { git = "https://github.com/shadowbrok3r/egui_dock",  features = ["serde"] } 
egui_logger = { git = "https://github.com/shadowbrok3r/egui_logger" }
rmcp = { version = "0.12.0", features = ["server", "client", "transport-async-rw"] }
chrono = { version = "0.4", default-features = false, features = ["now"] } # features = ["now", "wasmbind", "wasm-bindgen", "js-sys"]
tokio = { version = "1.49.0", features = ["full", "tracing"] }
async-openai-wasm = { version = "0.29.5" }
async-openai = { version = "0.29.5" } # , features = ["response-types"] }
image = { version = "0.25", features = ["jpeg", "png", "gif"] }
structdiff = {version = "0.7", features = ["rustc_hash"]}
bincode = { version="2", features = ["serde", "derive"] }
serde = { version = "1", features = ["derive"] }

wasm-bindgen-futures = "0.4.56"
wasm-bindgen = "0.2.106"
gloo-console = "0.3.0"
wasm-cookies = "0.2"
web-time = "1"
egui_plot = "0.34"
lazy_static = "1"
log="0.4"
serde_json = "1"
anyhow = "1"
dotenvy = "0.15.7"
mime_guess = "2"
crossbeam = "0.8"
futures = "0.3.31"
fuzzy-matcher = "0.3"
rusty-s3 = "0.8.1"
rfd = "0.17.1"
regex = "1.12"
async-trait = "0.1"
once_cell = "1"
simplelog = "0.12.2"
bytes = "1.11.0"
brotli = "8.0.2"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
surrealdb-types = { git = "https://github.com/surrealdb/surrealdb", tag = "v3.0.0-beta.1" }
itertools = "0.14"

[profile.dev]
debug = true
strip = false
lto = false

# [profile.release] # YOU NEED TO DISABLE 'STRIP = true' WHEN PUSHING WASM TO PRODUCTION
# strip = true
# lto = true
# panic = "unwind"
# debug = false
# opt-level = 3
# codegen-units = 1

# [profile.wasm-release] # trunk build --release --profile wasm-release
# inherits = "release"
# strip = false  # Disable strip just for this profile

[patch.'https://github.com/surrealdb/surrealdb']
# Override the main crate
surrealdb = { path = "surrealdb/crates/sdk" }
surrealdb-core = { path = "surrealdb/crates/core" }
surrealdb-types = { path = "surrealdb/crates/types" }