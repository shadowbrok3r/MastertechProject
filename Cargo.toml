[package]
name = "MasterTech"
version = "4.0.5"
edition = "2021"
description = "Mastertech"
build = "build.rs"

[build-dependencies]
static_vcruntime = "2.0"
embed-resource = "2.2.0"

[package.metadata]
icon = ["src/assets/mastertechlogo.png"]
resources = ["src/assets/**/*png"]


[dependencies]
chrono = "0.4.26"
eframe = "0.22.0"
egui = "0.22.0"
egui_dock = "0.6.3"
egui_extras = {version = "0.22.0", features = ["datepicker"]}
reqwest = {version = "0.11.18", features = ["json", "stream", "blocking"] }
sysinfo = "0.29.2"
tokio = { version = "1.29.1", features = ["full"] }
serde = { version = "1.0.164", features = ["derive"] }
serde_json = "1.0"
catppuccin-egui = "3.0.0"
futures-util = "0.3.28"
bytes = "1.4.0"
walkdir = "2.3.3"
futures = "0.3.28"
pollster = "0.3.0"
crossbeam = "0.8.2"
asana = "0.1.1"
regex = "1.9.1"
image = "0.24.6"
egui_file = "0.10.0"
self_update = "0.37.0"
libatasmart-sys = "0.2.0"


#libatasmart = "0.3.1"
#winres = "0.1.12"
#...
#opener = "0.6.1"
#directories = "5.0.1"
#jwalk = "0.8.1"
#openssl = { version = "0.10", features = ["vendored"] } #Only on linux
#egui_file = "0.9.0"

[package.metadata.winres]
OriginalFilename = "Mastertech.EXE"
LegalCopyright = "Copyright © 2023"


[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = "debuginfo"


