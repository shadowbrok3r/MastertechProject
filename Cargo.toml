[workspace]
resolver = "3"
members = [ "database" , "displays", "MtechServer2.0", "Mastertech4.0", "websocket_server2", "MastertechMobile"]

[workspace.dependencies]
database = { path = "database" }
eframe = { version="0.32", features=["serde",  "default_fonts", "glow"], default-features=false }
ratatui = { version = "0.29", features = ["crossterm", "unstable-widget-ref", "serde", "underline-color", "widget-calendar"]  }
egui_extras = { version = "0.32", features = ["datepicker", "syntect", "serde", "image", "all_loaders" ]}
wasm-cookies = { version= "0.2" }
image = { version = "0.25", features = ["jpeg", "png", "gif"] }
# surrealdb-alpha = {version = "3.0.6", features = ["protocol-ws"]}
surrealdb = { version = "2.3.7", features = ["protocol-ws"] } 
egui_logger = { git = "https://github.com/RegenJacob/egui_logger", branch = "improv" }
egui_dock = { version = "0.17.0", features = ["serde"]} # 
structdiff = {version = "0.7.3", features = ["rustc_hash"]}
bincode = { version="2", features = ["serde", "derive"] }
serde = { version = "1", features = ["derive"] }
egui_plot = "0.33.0"
egui-data-table = { git = "https://github.com/kang-sw/egui-data-table", branch = "master", features = ["persistency"]}
lazy_static = "1"
egui_json_tree = { version = "0.13.0", features = ["serde_json"] }
log="0.4"
serde_json = "1"
anyhow = "1"
mime_guess = "2"
crossbeam = "0.8"
futures = "0.3.31"
fuzzy-matcher = "0.3"
rusty-s3 = "0.8.1"
rfd = "0.15"
regex = "1.11"
async-trait = "0.1"
once_cell = "1"
simplelog = "0.12.2"
bytes = "1.10"
gloo-console = "0.3.0"
# egui_struct = "0.4"
wasm-bindgen = "0.2"
web-time = "1"
wasm-bindgen-futures = "0.4"
brotli = "8.0.2"
base64 = "0.22"
tokio = { version = "1.47.0", features = ["full", "tracing"] }
chrono = { version = "0.4", default-features = false, features = ["now"] } # features = ["now", "wasmbind", "wasm-bindgen", "js-sys"]
async-openai-wasm = { version = "0.29.0" }
async-openai = { version = "0.29" }
# egui_colors = "0.9.0"
itertools = "0.14"
rmcp = { version = "0.6", features = ["server", "client", "transport-async-rw"] }

[profile.dev]
debug = true
strip = false
lto = false

# [profile.release] # YOU NEED TO DISABLE 'STRIP = true' WHEN PUSHING WASM TO PRODUCTION
# strip = true
# lto = true
# panic = "unwind"
# debug = false
# opt-level = 3
# codegen-units = 1

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

