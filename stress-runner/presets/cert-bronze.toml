# Bronze certification — OCCT Bronze System parity (~2 h).
# CPU FMA -> CPU verify -> AVX2 verify -> RAM pattern-verify -> CPU+RAM verify -> GPU compute -> GPU matmul.

[preset]
name = "bronze"
label = "cert:bronze-v2"
description = "Bronze certification (~2h): CPU FMA, CPU verify, AVX2 verify, 80% RAM pattern-verify, 50% CPU+RAM verify, GPU compute + matmul"
target_kind = "system"
tags = ["preset:cert", "cert:bronze"]

[rules]
whea_fails = true
tdr_fails = true
stressor_errors_fail = true
# Graded against the part's own ceiling plus a 3C margin; limit_c applies only
# where that ceiling is unknown. Set basis = "absolute" to grade limit_c as written.
max_cpu_temp_c = { limit_c = 95.0, consecutive_ticks = 5 }
max_gpu_temp_c = { limit_c = 90.0, consecutive_ticks = 5, on_missing = "warn" }
clock_collapse = { below_pct_of_stage_max = 0.60, consecutive_ticks = 10, min_cpu_usage_pct = 50.0 }
throughput_cv = { warmup_ticks = 10, max_cv = 0.20, min_samples = 30 }

[[stage]]
label = "cpu_fma"
stressor = "fp"
duration_secs = 1800

[[stage]]
label = "cpu_verify"
stressor = "cpu_verify"
duration_secs = 900

[[stage]]
label = "avx2"
stressor = "avx2"
duration_secs = 600

[[stage]]
label = "memtest_80pct"
stressor = "mem_test"
duration_secs = 900
memory_pct = 80

[[stage]]
label = "cpu_mem_50pct"
stressor = "cpu_mem"
duration_secs = 900
memory_pct = 50

[[stage]]
label = "gpu_compute"
stressor = "gpu"
duration_secs = 900

[[stage]]
label = "gpu_matmul"
stressor = "gpu_matmul"
duration_secs = 900
