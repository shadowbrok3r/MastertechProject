[package]
name = "mastertech-mobile"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.7.9", features = ["router"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
anyhow.workspace = true
log.workspace = true
surrealdb.workspace = true
database.workspace = true
crossbeam-channel = "0.5"
futures-timer = "3"
dirs = "6"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false }

# Admin↔client session control reuses displays' `Cmd` wire type, bincode
# framing, and `AdminTransport` so mobile speaks the identical protocol to
# the Mastertech agent. Native gets `tokio` (for the direct-TCP path);
# wasm uses displays' default `wasm` feature (relay-only).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
displays = { workspace = true, optional = true, features = ["tokio"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
displays = { workspace = true, optional = true }

[features]
default = ["mobile", "client-sessions"]
# The feature that are only required for the web = ["dioxus/web"] build target should be optional and only enabled in the web = ["dioxus/web"] feature
web = ["dioxus/web"]
# The feature that are only required for the desktop = ["dioxus/desktop"] build target should be optional and only enabled in the desktop = ["dioxus/desktop"] feature
desktop = ["dioxus/desktop"]
# The feature that are only required for the mobile = ["dioxus/mobile"] build target should be optional and only enabled in the mobile = ["dioxus/mobile"] feature
mobile = ["dioxus/mobile"]
# Remote-client session listing + control (reboot/shell/etc). Pulls in the
# `displays` crate for the shared `Cmd`/`AdminTransport` protocol. Disable
# for a lean bundle: `--no-default-features --features mobile`.
client-sessions = ["dep:displays"]

# MastertechMobile is intentionally excluded from the root workspace (its
# dioxus dependency tree is kept out of `cargo build --workspace` / CI). It is
# its own workspace root; path deps (`database`, `displays`) still belong to
# the root workspace and resolve their own `workspace = true` deps there.
[workspace]

[workspace.dependencies]
database = { path = "../database" }
displays = { path = "../displays" }
surrealdb = { version = "3.2.0", features = ["protocol-ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["now"] }
anyhow = "1"
log = "0.4"

# `displays` depends on `egui-phosphor = "0.12"` which only compiles against
# egui 0.35 via this fork. Mirrors the root workspace's patch so the shared
# `displays` code resolves identically from this workspace.
[patch.crates-io]
egui-phosphor = { git = "https://github.com/shadowbrok3r/egui-phosphor", branch = "egui-035" }
