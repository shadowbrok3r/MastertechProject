[package]
name = "com_mastertech_xworm_remnant_scan"
version = "0.4.0"
edition = "2024"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
mtech-plugin-sdk = { path = "../../mtech-plugin-sdk" }
facet = "=0.46.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
