# Static server for the MtechServer2.0 frontend, included inside nginx's `http` block.

# Content-hashed files cache for a year, un-hashed scripts are never stored, the rest revalidates.
map $uri $asset_cache {
    default                                "no-cache";
    "~*-[0-9a-f]{16}(_bg)?\.[a-z0-9]+$"    "public, max-age=31536000, immutable";
    "~*\.js$"                              "no-store";
}

server {
    listen      8080;
    listen      [::]:8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    charset utf-8;

    # .gz siblings come from deploy/precompress.sh.
    gzip_static on;
    gzip_vary   on;

    # Readiness endpoint.
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header Pragma       "no-cache"                   always;
    }

    # Kill-switch service worker at a stable, un-hashed path.
    location = /sw.js         { add_header Cache-Control "no-store" always; }
    location = /manifest.json { add_header Cache-Control "no-cache" always; }

    # Empty `types` plus default_type forces application/wasm in this location only.
    location ~* \.wasm$ {
        types { }
        default_type application/wasm;
        add_header Cache-Control $asset_cache always;
    }

    location ~* \.(js|css|ico|png|svg|woff2?)$ {
        add_header Cache-Control $asset_cache always;
    }

    # Unresolved paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
