# Static server for the MtechServer2.0 WASM frontend.
#
# The official nginx image includes this file from inside its own `http` block
# (`include /etc/nginx/conf.d/*.conf;`), so this file holds a single `server` —
# no `http` / `events` wrapper.

# Trunk's `filehash = true` only hashes the main bundle — the worker bins
# (webworker*, deser_worker*) come out with stable, un-hashed names. Marking
# those `immutable` would pin a stale worker in every browser for a year, so
# the cache policy is derived from whether the filename actually carries a
# content hash rather than from the extension alone.
map $uri $asset_cache {
    default                                "no-cache";
    "~*-[0-9a-f]{16}(_bg)?\.[a-z0-9]+$"    "public, max-age=31536000, immutable";
}

server {
    listen      8080;
    listen      [::]:8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # `trunk serve` sent `text/html; charset=utf-8`; nginx would otherwise send
    # bare `text/html` and leave the browser to fall back to the meta tag.
    charset utf-8;

    # .gz siblings are generated at image build time by the Dockerfile.
    gzip_static on;
    gzip_vary   on;

    # Cheap target for a k8s readinessProbe — avoids pulling index.html just to
    # answer "are you up?". The old image had no probe because nothing could
    # honestly answer this until its in-container build finished.
    location = /healthz {
        access_log off;
        # `default_type`, not `add_header Content-Type` — `return` already sets a
        # Content-Type, so add_header would emit a second, duplicate one.
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # --- caching -------------------------------------------------------------
    # Hashed assets are safe to cache forever; index.html never is, or clients
    # keep requesting the previous build's asset names. Which is which comes
    # from $asset_cache (see the map above) — not every generated file is
    # hashed, so extension alone is not enough to decide.
    #
    # This split is the whole reason for moving off `trunk serve`: Trunk's
    # [serve.headers] applies globally, which forced `no-store` onto the 32MB
    # wasm and made every visitor re-download it on every page load.

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header Pragma       "no-cache"                   always;
    }

    # Exact-match locations outrank the regex blocks below regardless of order.
    # Kill-switch worker, deliberately served un-hashed at a stable path so
    # stale clients' legacy registrations find it. Must never go immutable.
    location = /sw.js         { add_header Cache-Control "no-cache" always; }
    # Un-hashed and not covered by the asset regexes below.
    location = /manifest.json { add_header Cache-Control "no-cache" always; }

    # An empty `types` block plus default_type is the safe way to force one MIME
    # type in a location — a populated `types {}` here would REPLACE the whole
    # inherited mime.types map. A wrong type breaks instantiateStreaming().
    location ~* \.wasm$ {
        types { }
        default_type application/wasm;
        add_header Cache-Control $asset_cache always;
    }

    location ~* \.(js|css|ico|png|svg|woff2?)$ {
        add_header Cache-Control $asset_cache always;
    }

    # egui SPA shell: anything unresolved falls back to index.html, matching
    # `trunk serve`'s behaviour. The fallback re-enters location matching, so
    # the no-store header above still applies.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # No Cross-Origin-Embedder-Policy / Cross-Origin-Opener-Policy.
    # Those are only required for SharedArrayBuffer (wasm threads), which this
    # build does not use: no `+atomics` in MtechServer2.0/.cargo/config.toml,
    # `initThreadPool` commented out in index.html, `wasm_bindgen_rayon`
    # commented out in src/workers/worker.rs, and Dockerfile.prod calls the
    # setup "single-threaded wasm for wasm-bindgen". Plain web workers (the
    # webworker / deser_worker bins) do not need them. Re-add BOTH if
    # threading comes back.

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
