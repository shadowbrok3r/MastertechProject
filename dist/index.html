<!DOCTYPE html>
<html>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

<!-- Disable zooming: -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">

<head>
    <!-- change this to your project name -->
    <title>MtechServer</title>

    <!-- config for our rust wasm binary. go to https://trunkrs.dev/assets/#rust for more customization -->
    <!-- <link data-trunk rel="rust" data-wasm-opt="2" /> -->
    
<script type="module">
import init, * as bindings from '/mtechserver-bb39a05226a8fb4c.js';
const wasm = await init('/mtechserver-bb39a05226a8fb4c_bg.wasm');


window.wasmBindings = bindings;

</script>
    
    
    <!-- this is the base url relative to which other urls will be constructed. trunk will insert this from the public-url option -->
    <base href="/" />

    <link rel="icon" href="/favicon-c001e5b1c7ab3ad1.ico" integrity="sha384&#x2D;zaXZOo5uu&#x2F;AE&#x2B;KdhwxSWL357SjkguHllY0M5VnzYwjLKQRAUZx55kbHaBjEf&#x2B;mKH"/>


    
    
    
    
    


    <link rel="manifest" href="manifest.json">
    <!-- <meta name="theme-color" media="(prefers-color-scheme: light)" content="white"> -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#404040">

    <style>
        html {
            /* Remove touch delay: */
            touch-action: manipulation;
        }

        body {
            /* Light mode background color for what is not covered by the egui canvas,
            or where the egui canvas is translucent. */
            background: #909090;
        }

        @media (prefers-color-scheme: dark) {
            body {
                /* Dark mode background color for what is not covered by the egui canvas,
                or where the egui canvas is translucent. */
                background: #404040;
            }
        }

        /* Allow canvas to fill entire web page: */
        html,
        body {
            overflow: hidden;
            margin: 0 !important;
            padding: 0 !important;
            height: 100%;
            width: 100%;
        }

        /* Position canvas in center-top: */
        canvas {
            margin-right: auto;
            margin-left: auto;
            display: block;
            position: absolute;
            top: 0%;
            left: 50%;
            transform: translate(-50%, 0%);
        }

        .centered {
            margin-right: auto;
            margin-left: auto;
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #f0f0f0;
            font-size: 24px;
            font-family: Ubuntu-Light, Helvetica, sans-serif;
            text-align: center;
        }

        /* ---------------------------------------------- */
        /* Loading animation from https://loading.io/css/ */
        .lds-dual-ring {
            display: inline-block;
            width: 24px;
            height: 24px;
        }

        .lds-dual-ring:after {
            content: " ";
            display: block;
            width: 24px;
            height: 24px;
            margin: 0px;
            border-radius: 50%;
            border: 3px solid #fff;
            border-color: #fff transparent #fff transparent;
            animation: lds-dual-ring 1.2s linear infinite;
        }

        @keyframes lds-dual-ring {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

    </style>

<link rel="modulepreload" href="/mtechserver-bb39a05226a8fb4c.js" crossorigin=anonymous integrity="sha384-bDxOs4D3beDtpUDZ8DHdpdOSAv3mZtTSczlK3eUJ7IkTNblfYu3jr2Lnn8Rli8hL">
<link rel="preload" href="/mtechserver-bb39a05226a8fb4c_bg.wasm" crossorigin=anonymous integrity="sha384-XCXqJuWr1vbCr8ylqBd+uFqWrVs/1lm4NKlYuEqYBQxlqfqJD7unQPR8/RRB8mCB" as="fetch" type="application/wasm"></head>

<body>
    <!-- The WASM code will resize the canvas dynamically -->
    <!-- the id is hardcoded in main.rs . so, make sure both match. -->
    <canvas id="mtech_canvas"></canvas>

    <!--Register Service Worker. this will cache the wasm / js scripts for offline use (for PWA functionality). -->
    <!-- Force refresh (Ctrl + F5) to load the latest files instead of cached files  -->
    <script>
        // We disable caching during development so that we always view the latest version.
        if ('serviceWorker' in navigator && window.location.hash !== "#dev") {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>
</body>

</html>
