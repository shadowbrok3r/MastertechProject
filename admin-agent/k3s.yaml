# Kubernetes manifests for the admin-agent crate.
#
# Always-on headless MasterTech: holds admin sessions to connected clients,
# hosts the plugin MCP server, and runs tech-confirmed assist requests as Codex
# threads through zc-codexd on the zeroclaw box. Mirrors the axum-server
# pattern: single replica pinned to `ubuntu-server`.
#
# Deliberately NO Ingress. The plugin MCP server has no authentication (it is
# built to listen on loopback), so a public hostname would expose remote
# diagnostics on customer machines to anyone. The broker only makes outbound
# calls (database, zc-codexd, connected clients); the one inbound route is the
# LAN-scoped MCP port below, which ZeroClaw's remaining agents still use.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-agent
  namespace: rust
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-agent
  strategy:
    # Two brokers would both claim assist rows; the guarded claim makes that
    # safe but pointless, and two session pumps would double-dial every client.
    type: Recreate
  template:
    metadata:
      labels:
        app: admin-agent
    spec:
      nodeSelector:
        kubernetes.io/hostname: ubuntu-server
      containers:
      - name: admin-agent
        image: shadowbrok3r/admin_agent:beta
        imagePullPolicy: Always
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "America/Denver"
        - name: RUST_LOG
          value: "admin_agent=info,displays=info,database=warn"
        # Defaults to 127.0.0.1, which is unreachable from outside the pod.
        - name: MTECH_MCP_HTTP_ADDR
          value: "0.0.0.0:9004"
        # Codex broker: zc-codexd on the zeroclaw box (LAN, bearer token). Unset,
        # assist requests stay pending and nothing runs.
        - name: MTECH_CODEXD_URL
          value: "ws://192.168.22.7:7420"
        - name: MTECH_CODEXD_TOKEN
          valueFrom:
            secretKeyRef:
              name: zc-codexd
              key: token
        - name: MTECH_CODEX_MODEL
          value: "zc-heavy"
        - name: MTECH_CODEX_PROVIDER
          value: "zcpool"
        - name: MTECH_CODEX_CWD
          value: "/home/shadowbroker/zc-sessions"
        - name: MTECH_CODEX_MAX_THREADS
          value: "6"
        - name: MTECH_AGENT_NODE
          value: "admin-agent"
        # Transcripts, turns and approvals of closed sessions are purged after this.
        - name: MTECH_AGENT_EVENT_RETENTION_DAYS
          value: "30"
        # ZeroClaw's memory over its gateway REST API: the agent's recall/remember
        # tools, the brief at session start and the note at close. Same store its
        # own agents use.
        - name: MTECH_ZC_GATEWAY
          value: "https://zeroclaw.master-tech.app"
        - name: MTECH_ZC_TOKEN
          valueFrom:
            secretKeyRef:
              name: zeroclaw-gateway
              key: token
        # Signin failure is non-fatal — the daemon continues as guest — so these
        # are optional. The agent tables are PERMISSIONS FULL, so guest works;
        # set them to attribute the daemon's writes to a service account.
        - name: MTECH_AGENT_USER
          valueFrom:
            secretKeyRef:
              name: mtech-agent
              key: user
              optional: true
        - name: MTECH_AGENT_PASS
          valueFrom:
            secretKeyRef:
              name: mtech-agent
              key: pass
              optional: true
        ports:
        - name: mcp
          containerPort: 9004
      imagePullSecrets:
      - name: regcred

---

apiVersion: v1
kind: Service
metadata:
  name: admin-agent
  namespace: rust
spec:
  type: ClusterIP
  selector:
    app: admin-agent
  ports:
  - name: mcp
    port: 9004
    targetPort: 9004

---

# LAN route for zeroclaw's remaining agents: MCP tool calls in.
#
# `externalTrafficPolicy: Local` preserves the client source IP, which the
# NetworkPolicy below matches on; the trade-off is that only the node running
# the pod serves this port, and the pod is pinned to `ubuntu-server`
# (192.168.120.122) — the address zeroclaw already reaches.
apiVersion: v1
kind: Service
metadata:
  name: admin-agent-lan
  namespace: rust
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: admin-agent
  ports:
  - name: mcp
    port: 9004
    targetPort: 9004
    nodePort: 30904

---

# Source restriction for the LAN-exposed MCP port.
#
# The plugin MCP server on 9004 has no authentication of its own, so this is
# the only thing between it and every other host on the shop LAN — which
# includes live-infected intake machines.
#
# Ingress-only: `policyTypes` omits Egress, so the daemon still dials the
# database, zc-codexd and connected clients. Nothing in-cluster calls this pod,
# so no namespace or pod selectors are allowed in.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: admin-agent-lan-only
  namespace: rust
spec:
  podSelector:
    matchLabels:
      app: admin-agent
  policyTypes:
  - Ingress
  ingress:
  - from:
    - ipBlock:
        cidr: 192.168.22.7/32
    ports:
    - protocol: TCP
      port: 9004
