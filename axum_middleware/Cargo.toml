[package]
name = "axum_middleware"
version = "0.1.0"
edition = "2024"

[dependencies]
# The core stuff
database = { workspace=true }
axum = {version = "0.8.3", features=["tracing", "macros", "multipart", "ws"]}
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["full"] }
tower-cookies = "0.11.0"
tokio = { version="1", features=["full"] }
futures-util = "0.3"
http = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
dotenv="0.15"
tokio-cron-scheduler = {version = "0.13", features = ["english"]}

# For logging
log = "0.4"
tracing-subscriber = { version="0.3", features=["env-filter", "json"] }
tracing = "0.1"

# Database 
surrealdb = { version = "2", features = ["protocol-ws"] } # kv-speedb "protocol-http", "native-tls"
uuid = { version = "1.8", features = ["v4", "fast-rng"] }
chrono = "0.4"
futures = "0.3"
tokio-util = "0.7"
futures-channel = "0.3"
anyhow = "1"

[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
openssl-sys = "0.9"