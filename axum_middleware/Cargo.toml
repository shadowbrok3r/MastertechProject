[package]
name = "axum_middleware"
version = "0.1.0"
edition = "2021"

[dependencies]
# The core stuff
axum = {version = "0.7.5", features=["tracing", "macros", "multipart", "ws"]}
tower = { version = "0.4.13", features = ["util"] }
tower-http = { version = "0.5.2", features = ["full"] }
tower-cookies = "0.10.0"
tokio = { version="1.37.0", features=["full"] }
futures-util = "0.3.30"
http = "1.1.0"
serde_json = "1.0.116"
serde = { version = "1.0.198", features = ["derive"] }
dotenv="0.15.0"
tokio-cron-scheduler = "*"

# For logging
log = "0.4.21"
tracing-subscriber = {version="0.3.18", features=["env-filter", "json"]}
tracing = "0.1.40"

# Database 
surrealdb = { version = "2.1.3", features = ["protocol-ws"] } # kv-speedb "protocol-http", "native-tls"
uuid = { version = "1.8.0", features = ["v4", "fast-rng"] }
chrono = "0.4.38"
futures = "0.3.30"
tokio-util = "0.7.10"
futures-channel = "0.3.30"
anyhow = "1.0.83"

