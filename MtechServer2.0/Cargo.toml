[package]
name = "mtechserver"
version = "2.1.3"
edition = "2021"

# [[bin]]
# name = "mtechserver"
# path = "src/mtechserver.rs"

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "webworker"
path = "src/webworker.rs"

[dependencies]
console_error_panic_hook = "0.1"
gloo-worker = "0.5"
# gloo-timers = { version = "0.3", features = ["futures"]}
js-sys = "0.3"
gloo-net = { version = "0.6", features = ["http"]}
web-sys = { version = "0.3", features = ["Storage", "Window", "Location", "HtmlCanvasElement"] }
wasm-cookies = { version= "0.2" }
ewebsock = "0.8"
egui_plot = "0.30"
rusty-s3 = { version = "0.5", features = ["wasm_bindgen"] } # default-features = false
reqwest = { version = "0.12", features = ["stream", "json"] }
displays = { path="../displays", features = ["wasm"]}

egui-modal = { workspace = true }
brotli = { workspace=true }
base64 = { workspace=true }
wasm-bindgen-futures = { workspace=true }
web-time = { workspace=true }
wasm-bindgen = { workspace=true }
database = { workspace=true }
surrealdb = { workspace=true }
structdiff = { workspace=true }
bytes = { workspace=true }
log  = { workspace=true }
serde = { workspace=true }
chrono = { workspace=true }
image = { workspace = true }
# dotenv = { workspace=true }
serde_json = { workspace=true }
egui_extras = { workspace=true }
egui_dock = { workspace=true }
anyhow = { workspace=true }
eframe = { workspace=true }
# ratatui = { workspace=true }
crossbeam = { workspace=true }
futures = { workspace=true }
bincode = { workspace=true }
rfd = { workspace=true }
regex = { workspace=true }
gloo-console = { workspace=true }




