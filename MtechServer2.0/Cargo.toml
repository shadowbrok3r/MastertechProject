[package]
name = "mtechserver"
version = "4.6.9"
edition = "2024"

# [[bin]]
# name = "mtechserver"
# path = "src/workers/mtechserver.rs"

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "webworker"
path = "src/workers/webworker.rs"

[[bin]]
name = "deser_worker"
path = "src/workers/deser_worker.rs"

[dependencies]
displays = { path="../displays", features = ["wasm"]}
gloo-worker = "0.5"
js-sys = "0.3.83"
zstd = "0.13"
web-sys = { version = "0.3", features = [
	"Storage",
	"Window",
	"Location",
	"HtmlCanvasElement",
	"CacheStorage",
	"Navigator",
	"ServiceWorkerContainer",
	"ServiceWorkerRegistration"
] }
wasm-cookies = { workspace = true }
wasm-bindgen-futures = { workspace=true }
wasm-bindgen = { workspace=true }
web-time = { workspace=true }
egui_logger = {workspace = true }
brotli = { workspace=true }
base64 = { workspace=true }
database = { workspace=true }
log  = { workspace=true }
serde = { workspace=true }
serde_json = { workspace=true }
egui_extras = { workspace=true }
egui_dock = { workspace=true }
anyhow = { workspace=true }
eframe = { workspace=true }
crossbeam = { workspace=true }
gloo-console = { workspace=true }

