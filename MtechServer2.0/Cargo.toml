[package]
name = "mtechserver"
version = "2.4.1"
edition = "2024"

# [[bin]]
# name = "mtechserver"
# path = "src/mtechserver.rs"

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "webworker"
path = "src/webworker.rs"

[[bin]]
name = "deser_worker"
path = "src/deser_worker.rs"

[dependencies]
zstd = "0.13"
gloo-worker = "0.5"
web-sys = { version = "0.3", features = ["Storage", "Window", "Location", "HtmlCanvasElement", "CacheStorage"] }
displays = { path="../displays", features = ["wasm"]}
wasm-cookies = { workspace = true }
egui_logger = {workspace = true }
brotli = { workspace=true }
base64 = { workspace=true }
wasm-bindgen-futures = { workspace=true }
web-time = { workspace=true }
wasm-bindgen = { workspace=true }
database = { workspace=true }
log  = { workspace=true }
serde = { workspace=true }
serde_json = { workspace=true }
egui_extras = { workspace=true }
egui_dock = { workspace=true }
anyhow = { workspace=true }
eframe = { workspace=true }
crossbeam = { workspace=true }
gloo-console = { workspace=true }

