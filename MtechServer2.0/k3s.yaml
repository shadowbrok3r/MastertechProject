apiVersion: apps/v1
kind: Deployment
metadata:
  name: mtechserver
  namespace: rust
spec:
  selector:
    matchLabels:
      app: mtechserver
  template:
    metadata:
      labels:
        app: mtechserver
    spec:
      nodeSelector:
        kubernetes.io/hostname: ubuntu-server
      containers:
      - name: mtechserver
        image: shadowbrok3r/mtechserver:latest
        imagePullPolicy: Always
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "America/Denver"
        ports:
        - containerPort: 8080
      imagePullSecrets:
      - name: regcred

--- 

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mtechserver
  namespace: rust
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
    traefik.ingress.kubernetes.io/router.tls.certresolver: cloudflare
spec:
  rules:
    - host: master-tech.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mtechserver
                port:
                  number: 80

---

apiVersion: v1
kind: Service
metadata:
  name: mtechserver
  namespace: rust
spec:
  clusterIP: None
  selector:
    app: mtechserver
  ports:
  - port: 80
    targetPort: 8080