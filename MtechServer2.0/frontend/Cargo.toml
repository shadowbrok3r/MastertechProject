[package]
name = "mtechserver"
version = "2.0.2"
edition = "2021"

[dependencies]
database = { workspace=true }
log  = { workspace=true }
serde = { workspace=true }
chrono = { workspace=true }
dotenv = { workspace=true }
serde_json = { workspace=true }
surrealdb = { workspace=true }
# surrealdb-alpha = { workspace=true }


anyhow = "1"
eframe = { version="0.28", default-features = false, features=["glow", "default_fonts", "persistence", "serde"] } # wgpu
# wgpu = { version = "0.20", features = ["webgpu", "webgl", "fragile-send-sync-non-atomic-wasm"] }
wasm-bindgen = "0.2"
egui_extras = { version = "0.28", features = ["datepicker"]}
egui_dock = { version = "0.13", features = ["serde"]}
ratframe = "1"
ratatui = { version = "0.27", default-features = false }
web-time = "1.1"
wasm-bindgen-futures = "0.4"
crossbeam = "0.8"
console_error_panic_hook = "0.1"
gloo-worker = "0.5"
gloo-net = { version = "0.6", features = ["http"]}
web-sys = { version = "0.3", features = ["Storage", "Window", "Location"] }
futures = "0.3"
wasm-cookies = { version= "0.2" }

egui_form = {version="0.2", features = ["validator_validator"]}
egui_ratatui = "0.0.10"
fuzzy-matcher = "0.3"
ewebsock = "0.6"
uuid = { version = "1.10", features = ["v4"] }
bincode = "1.3"
egui_plot = "0.28"
rusty-s3 = { version = "0.5", features = ["wasm_bindgen"] } # default-features = false
# rust-s3 = {version = "0.23.0-beta2", features = ["wasm"], default-features = false}
rfd = "0.14"
async-openai-wasm = { version = "0.23" }
derive_more = {version = "0.99", features = ["from"]}
rpc-router = "0.1"
schemars = "0.8"
mime_guess = "2"
reqwest = { version = "0.12", features = ["stream", "json"] }
bytes = "1.6"
once_cell = "1.19.0"
async-trait = "0.1.81"
gloo-console = "0.3.0"
regex = "1.10.5"
# crossterm = { version= "0.27", default-features = false }

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

# [profile.release]
# opt-level = 2 # fast and small wasm

# Optimize all dependencies even in debug builds:
# [profile.dev.package."*"]
# opt-level = 2
# 
[[bin]]
name = "dummy_worker"
path = "src/dummy_worker.rs"

[[bin]]
name = "live_worker"
path = "src/live_worker.rs"
