[package]
name = "MasterTech"
version = "4.8.0"
edition = "2024"
description = "Mastertech"
build = "build.rs"

[package.metadata.winres]
ProductName = "Mastertech" 
OriginalFilename = "Mastertech.EXE"
LegalCopyright = "Copyright © 2025"
ProductVersion = "4.8.0"
FileDescription = "Mastertech"

[package.metadata]
icon = ["src/assets/masterlogoV2.ico"]
resources = ["src/assets/**/*png", "src/assets/**/*ico"]

[[bench]]
name = "file_copy_benchmark"
harness = false

[features]
default = [ "inline" ]
inline = []
# egui_skia CPU/software renderer fallback for machines with no working GPU GL
# stack (Windows PE). Off by default: `cargo build`/`cargo run` skip skia-bindings
# entirely, avoiding its from-source compile (ninja, Developer Mode, long build
# times -- see BUILD.md). Enable with --features skia-render.
skia-render = ["dep:egui_skia", "dep:skia-safe", "dep:softbuffer", "dep:winit", "dep:raw-window-handle"]

[dependencies]
eframe = { version="0.35", features=["persistence", "serde",  "default_fonts", "glow", "x11", "accesskit"], default-features=false }
displays = { path="../displays", features = ["tokio", "wasm-plugins", "native-telemetry"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "stream", "cookies", "brotli", "native-tls-vendored", "form", "charset", "http2", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ewebsock = { git = "https://github.com/shadowbrok3r/ewebsock.git", features = ["tokio", "tls", "rustls_ring"]}
sysinfo = {version = "0.39.1", features = ["serde", "multithread"]}
quick-xml = { version="0.40.1", features = ["serialize"] }
tracing = { version = "0.1", features = ["log"] }
clap = { version = "4.5", features = ["derive"] }
sha2 = { version = "0.10", features = ["std"] }
nvml-wrapper = { version = "0.12.1", features = ["serde"] }
strum = { version = "0.28.0", features = ["strum_macros", "derive"] }
rmcp = { version = "2", features = ["server", "transport-io", "schemars"]}
enigo = { version = "0.6.1", features = ["serde"] }
indexmap = { version = "2.13.0", features = ["serde"] }
tachyonfx = { version = "0.25.0"}
tui-logger = { git = "https://github.com/shadowbrok3r/tui-logger" }
rayon = "1"
textwrap = "0.16"
futures-util = "0.3"
walkdir = "2.5"
zip = "8.6.0"
pollster = "0.4"
image = "0.25"
num-format = "0.4"
fs_extra = "1.3"
num-traits = "0.2"
tracing-subscriber = "0.3"
rust-embed = "8.4"
linked-hash-map = "0.5"
hex = "0.4.3"
ring = "0.17.14"
semver = "1"
lazy_static = "1.5"
powershell_script = "1.1.0"
color-eyre = "0.6"
unicode-width = "0.2.0"
arboard = "3"
tempfile = "3.19"
xcap = "0.9.0"
display-info = "0.5"
zstd = "0.13.3"
humansize = "2"
multi_log = "0.1"
env_logger = "*"
dunce = "1.0.5"
directories = "6.0.0"
image-meta = "0.1.4"
rusqlite = { version = "0.39.0", features = ["bundled"] }

egui_skia = { git = "https://github.com/shadowbrok3r/egui_skia", features = ["winit", "cpu_fix"], optional = true }
skia-safe = { version = "0.99", optional = true }
softbuffer = { version = "0.4", optional = true }
winit = { version = "0.30", features = ["rwh_06"], optional = true }
raw-window-handle = { version = "0.6", optional = true }

# nvme = "0.2.2"

database = { workspace=true, features = ["desktop"] }
stress-kit = { workspace = true, features = ["winring0-thermal"] }
itertools.workspace = true
stress-runner.workspace = true
tcp_protocol = { workspace = true, features = ["tunnel"] }
surrealdb.workspace = true
ratatui = { workspace = true }
egui_extras.workspace = true
egui_dock.workspace = true
egui-data-table.workspace = true
tokio.workspace = true
serde_json.workspace = true
serde.workspace = true
log .workspace = true
anyhow.workspace = true
crossbeam.workspace = true
futures.workspace = true
bincode.workspace = true
rfd.workspace = true
regex.workspace = true
chrono.workspace = true
simplelog.workspace = true
async-trait.workspace = true
once_cell.workspace = true
base64.workspace = true
fuzzy-matcher.workspace = true
uuid.workspace = true
egui_inspection = { version = "0.35", features = ["plugin"] }

[dependencies.egui]
version = "0.35"
default-features = false
features = ["rayon", "bytemuck"]

[dependencies.crossterm]
version = "0.29"
features = ["event-stream"]

[target.'cfg(target_os = "windows")'.dependencies]
windows = {version = "0.62", features = [
    "Win32_System",
    "Win32_System_Console",
    "Win32_UI_Shell",
    "Win32",
    "Win32_System_Com",
    "Win32_System_UpdateAgent",
    "Win32_System_Shutdown",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_SecurityCenter",
    "Win32_System_Registry",
    "Storage",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock", 
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_WiFi",
    "Win32_System_Diagnostics",
    "Win32_Devices",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Power"
]}
winapi = { version = "0.3", features = ["processthreadsapi"] }
minidump-processor = { version = "0.26", features = ["http"] }
breakpad-symbols = { version = "0.26" }
minidump-common = { version = "0.26" }
minidump = { version = "0.26" }
dump-triage = { workspace = true }
memmap2 = "0.9"
windows_x86_64_msvc = "0.53"
minidump-unwind = "0.26"
windows-registry = "0.6"
# `#[implement(...)]` expands to `::windows_core::...`; needs this crate even when using `windows::core` in source.
windows-core = "0.62"
wmi = "=0.18.3"
evtx = "0.11"

[target.'cfg(target_os = "windows")'.build-dependencies]
dotenvy = { workspace = true }
static_vcruntime = "3"
embed-resource = "3"
winres = "0.1"
# embed-manifest = "1.4.0"

[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
openssl-sys = "0.9"
whoami = "2"

[dev-dependencies]
criterion = { version = "0.8.0", features = ["async_tokio"]}


