[package]
name = "MasterTech"
version = "4.3.2"
edition = "2021"
description = "Mastertech"
build = "build.rs"

[features]
default = [ "inline" ] # "term", "gui"
# gui = [ "dep:eframe" ]
# term = ["dep:tui-input", "dep:tui-textarea", "dep:ratatui"]
inline = []
# default=["winit"]   # , "cpu_fix", "compat_mode"
# winit = ["dep:egui-winit"]
# compat_mode = ["dep:egui_skia", "dep:egui-winit", "dep:softbuffer", "dep:skia-safe"] cpu_fix = []

[dependencies]
eframe = { version="0.31", features=["persistence", "serde",  "default_fonts", "wgpu", "x11"], default-features=false}
displays = { path="../displays", features = ["tokio"] }
reqwest = { version = "0.12", features = ["json", "stream", "cookies", "brotli"] }
ratatui = { version = "0.29.0", features = ["crossterm"]}
tui-input = { version = "0.11", features = ["crossterm"]}
yeehaw = "0.1.0"
tui-textarea = { version = "0.7"}
sysinfo = "0.33"
futures-util = "0.3"
walkdir = "2.5"
pollster = "0.4"
image = "0.25"
egui_file = "0.22"
num-format = "0.4"
fs_extra = "1.3"
rayon = "1"
quick-xml = { version="0.37", features = ["serialize"] }
num-traits = "0.2"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = "0.3"
rust-embed="8.4"
clap = { version = "4.5", features = ["derive"] }
dotenv = "0.15"
shell-words = "1"
reqwest_cookie_store = "0.8"
sha2 = { version = "0.10", features = ["std"] }
linked-hash-map = "0.5"
ewebsock = { version = "0.8", features = [ "tls" ] }
hex = "0.4.3"
ring = "0.17.8"
semver = "1.0.23"
nvml-wrapper = { version = "0.10.0", features = ["serde"] }
lazy_static = "1.5.0"
powershell_script = "1.1.0"
color-eyre = "0.6.3"
itertools = "0.14.0"
tui-scrollview = "0.5.1"
# planif = "1"

database = { workspace=true }
surrealdb = { workspace=true }
tokio = { workspace=true }
serde_json = { workspace=true }
serde = { workspace=true }
log  = { workspace=true }
egui_extras = { workspace=true }
egui_dock = { workspace=true }
anyhow = { workspace=true }
crossbeam = { workspace=true }
futures = { workspace=true }
uuid = { workspace=true }
bincode = { workspace=true }
rfd = { workspace=true }
regex = { workspace=true }
chrono = { workspace=true }
simplelog = { workspace=true }
async-trait = { workspace=true }
# ratframe = { workspace=true }


[dependencies.egui]
version = "0.31"
default-features = false
features = ["rayon", "bytemuck", "log"]

# windows_x86_64_msvc
# known-folders 
# robocopyrs 

[target.'cfg(target_os = "windows")'.dependencies]
windows = {version = "0.59.0", features = [
    "Win32_System",
    "Win32",
    "Win32_System_Com",
    "Win32_System_UpdateAgent",
    "Win32_System_Shutdown",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Ole",
    "Win32_System_Variant",
]}
windows-core = "0.59"
winapi = { version = "0.3", features = ["processthreadsapi"] }
memmap2 = "0.9"
minidump = { version = "0.22" }
minidump-common = { version = "0.22" }
minidump-processor = { version = "0.22", features = ["http"] }
minidump-unwind = "0.22"
wmi = "0.15.0"


[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
openssl-sys = "0.9"


[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"]}

[[bench]]
name = "file_copy_benchmark"
harness = false

[target.'cfg(target_os = "windows")'.build-dependencies]
static_vcruntime = "2"
embed-resource = "3.0.1"
winres = "0.1"
windows_x86_64_msvc = "0.53"

[package.metadata]
icon = ["D:/Users/Owner/Documents/GitHub/Mastertech4.0/src/assets/masterlogoV2.ico"]
resources = ["src/assets/**/*png", "src/assets/**/*ico"]

[package.metadata.winres]
ProductName = "Mastertech" 
OriginalFilename = "Mastertech.EXE"
LegalCopyright = "Copyright © 2024"
ProductVersion = "4.2.1"
FileDescription = "Mastertech"
