# Generated from displays::scripts::categories; display names are the wire contract.

[[script]]
id = "bench-suite"
name = "Benchmark Suite"
category = "stress"
summary = "Scored CPU/RAM/disk/GPU suite; run when the complaint is slowness and you need numbers"
pass = "All benchmarks complete with zero errors; scores persisted"
warn = "Kind reporting status no_samples (zero throughput ticks; row persisted unscored, suite still passes)"
fail = "Any benchmark errors"
timeout_secs = 1800
surfaces = ["terminal", "remote", "mcp"]
order = 10

