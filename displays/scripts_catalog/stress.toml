# Generated from displays::scripts::categories; display names are the wire contract.

[[script]]
id = "cert-bronze"
name = "Cert: Bronze"
category = "stress"
summary = "Cert tier ~1.5h: CPU, RAM and GPU verified; run as minimum sign-off on a stock build"
pass = "All stages pass the cert rules (temps, WHEA, throughput stability)"
fail = "Any rule violation, WHEA delta, or stressor error"
timeout_secs = 7200
surfaces = ["egui", "terminal", "remote", "mcp"]
order = 10

