[package]
name = "displays"
version = "4.7.8"
edition = "2024"

[features]
default = [ "wasm" ]
tokio = ["dep:tokio"]
wasm = ["dep:wasm-bindgen-futures", "dep:web-time"]
wasm-plugins = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:wat"]
puffin = []

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
eframe = { version = "0.34", features = ["x11", "wayland"], default-features = false }

[dependencies]
structdiff = { version = "0.7", features = ["rustc_hash"] }
reqwest = { version = "0.13", default-features = false, features = ["stream", "json"] }
compact_str = { version = "0.9.0", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
rpc-router = "0.2.0"
derivative = "2"
schemars = "1"
zstd = "0.13"
tap = "1"
jiff = "0.2"

# surrealdb-alpha ={ workspace = true }
surrealdb-types = { workspace = true }
egui-data-table = { workspace = true }
egui_json_tree = { workspace = true }
fuzzy-matcher.workspace = true
async-trait = { workspace = true }
egui_plot = { workspace = true }
egui_extras.workspace = true
itertools = { workspace = true }
serde_json.workspace = true
mime_guess.workspace = true
crossbeam.workspace = true
surrealdb.workspace = true
egui_dock.workspace = true
once_cell.workspace = true
database = { workspace=true, features = ["desktop"] }
tcp_protocol = { workspace = true }
web-time.workspace = true
futures.workspace = true
bincode.workspace = true 
brotli.workspace = true
anyhow.workspace = true
eframe.workspace = true
base64.workspace = true
chrono.workspace = true
serde.workspace = true
bytes.workspace = true
regex.workspace = true
rfd = { workspace = true }
async-openai = { workspace = true }
log.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.image]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ewebsock = { git = "https://github.com/shadowbrok3r/ewebsock.git", version = "0.9.3", features = ["tokio", "tls", "rustls_ring"]}
tokio = { workspace = true, optional = true }
ratatui = { workspace = true }
dotenv = { version = "0.15" }
rusty-s3 = { workspace = true }
rmcp = { workspace = true }
axum = { workspace = true }
wasmtime = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }
wat = { workspace = true, optional = true }
# Builder-worker wire types. Only used on desktop where the admin/MCP
# layer dispatches remote `cargo build` jobs. The plugin_builder crate
# pulls tokio + tungstenite which don't fit a wasm bundle, so it's
# scoped to non-wasm targets.
plugin_builder = { path = "../plugin_builder" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ewebsock = { git = "https://github.com/shadowbrok3r/ewebsock.git", version = "0.9.3", features = ["tls", "rustls_ring"]}
rusty-s3 = { workspace = true, features = ["wasm_bindgen"]}
wasm-bindgen-futures = { workspace=true, optional = true }
web-time = { workspace=true, optional = true }
wasm-cookies = { workspace = true}
web-sys = { version = "0.3", features = [
	"Storage",
	"Window",
	"Location",
	"HtmlCanvasElement",
	"CacheStorage",
	"Navigator",
	"ServiceWorkerContainer",
	"ServiceWorkerRegistration"
] }
js-sys = "0.3"

[build-dependencies]
dotenvy = { workspace = true }