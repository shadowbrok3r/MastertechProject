[package]
name = "displays"
version.workspace = true
edition = "2024"

[features]
default = [ "wasm" ]
tokio = ["dep:tokio"]
native-telemetry = ["dep:stress-kit", "stress-kit/hw-sensors"]
wasm = ["dep:wasm-bindgen-futures", "dep:web-time"]
wasm-plugins = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:wat"]
puffin = []

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
eframe = { version = "0.36", features = ["x11", "wayland", "links"], default-features = false }

# Desktop-only: the admin console's remote-desktop clipboard mirroring reads the
# operator's clipboard, which egui only exposes on paste. No iOS/Android/wasm
# backend exists, so those targets fall back to the paste-event path.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
arboard = "3"

[dependencies]
structdiff = { version = "0.7", features = ["rustc_hash"] }
reqwest = { version = "0.13", default-features = false, features = ["stream", "json"] }
compact_str = { version = "0.9.0", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
rpc-router = "0.2.0"
derivative = "2"
schemars = "1"
zstd = "0.13"
tap = "1"
jiff = "0.2"

# surrealdb-alpha ={ workspace = true }
surrealdb-types = { workspace = true }
egui-data-table = { workspace = true }
egui_json_tree = { workspace = true }
fuzzy-matcher.workspace = true
async-trait = { workspace = true }
egui_plot = { workspace = true }
egui_extras.workspace = true
itertools.workspace = true
serde_json.workspace = true
mime_guess.workspace = true
crossbeam.workspace = true
surrealdb.workspace = true
egui_dock.workspace = true
# No `stress-ui`: it pulls stress-runner's tokio/full (mio) into wasm and mobile.
mtech-ui = { workspace = true }
once_cell.workspace = true
tcp_protocol = { workspace = true, features = ["fingerprint"] }
facet = { workspace = true, features = ["std", "chrono", "reflect"] }
web-time.workspace = true
futures.workspace = true
bincode.workspace = true 
brotli.workspace = true
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
serde.workspace = true
bytes.workspace = true
regex.workspace = true
async-openai = { workspace = true }
log.workspace = true
egui-phosphor = { version = "0.12.0", default-features = false, features = ["regular"] }

# The grab-pass reads object-valued GL bindings, which glow's WebGL backend panics on, so wasm
# gets the no-op glass backend and does not compile the dependency. See ui_tools::glass_backdrop.
[target.'cfg(not(any(target_os = "ios", target_os = "android", target_arch = "wasm32")))'.dependencies]
backdrop-blur-egui = { workspace = true }

# Mobile targets get no rfd (no iOS/Android backend) and a renderer-less eframe (glow/glutin cannot compile there).
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
eframe = { workspace = true }
rfd = { workspace = true }
database = { workspace = true, features = ["desktop"] }

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
eframe = { version = "0.36", features = ["serde", "default_fonts"], default-features = false }
database = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.image]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Adds the relay-tunnel transport on native (unioned with the base
# `fingerprint` feature); wasm keeps only `fingerprint`.
tcp_protocol = { workspace = true, features = ["tunnel"] }
ewebsock = { git = "https://github.com/shadowbrok3r/ewebsock.git", version = "0.9.3", features = ["tokio", "tls", "rustls_ring"]}
tokio = { workspace = true, optional = true }
dump-triage = { workspace = true, features = ["facet"] }
mtech-plugin-sdk = { workspace = true }
stress-kit = { workspace = true, optional = true }
stress-runner = { workspace = true }
ratatui = { workspace = true }
dotenv = { version = "0.15" }
rmcp = { workspace = true }
axum = { workspace = true }
wasmtime = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }
wat = { workspace = true, optional = true }
# Builder-worker wire types. Only used on desktop where the admin/MCP
# layer dispatches remote `cargo build` jobs. The plugin_builder crate
# pulls tokio + tungstenite which don't fit a wasm bundle, so it's
# scoped to non-wasm targets.
plugin_builder = { path = "../plugin_builder" }
# Client for egui 0.36's native inspection protocol (the `protocol` module needs no feature).
egui_inspection = "0.36"

[target.'cfg(target_arch = "wasm32")'.dependencies]
dump-triage = { path = "../dump-triage", default-features = false }
ewebsock = { git = "https://github.com/shadowbrok3r/ewebsock.git", version = "0.9.3", features = ["tls", "rustls_ring"]}
wasm-bindgen-futures = { workspace=true, optional = true }
web-time = { workspace=true, optional = true }
wasm-cookies = { workspace = true}
web-sys = { version = "0.3", features = [
	"Storage",
	"Window",
	"Location",
	"HtmlCanvasElement",
	"CacheStorage",
	"Navigator",
	"ServiceWorkerContainer",
	"ServiceWorkerRegistration"
] }
js-sys = "0.3"