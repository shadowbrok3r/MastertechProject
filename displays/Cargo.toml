[package]
name = "displays"
version = "0.1.0"
edition = "2021"

[features]
default = [ "wasm" ]
tokio = ["dep:tokio"]
wasm = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-time"]

[dependencies]
parking_lot = "0.12"
ewebsock = "0.8"
zstd = "0.13"
reqwest = { version = "0.12", features = ["stream", "json"] }
rfd = "0.15"
tap = "1"
itertools = "0.14"
thiserror = "2"
derive_more = {version = "1", features = ["from"]}
rpc-router = "0.1"
schemars = "0.8"
derivative = "2"
async-lock = "3"
web-time = { workspace=true }
bincode = { workspace=true } 
anyhow = { workspace=true }
database = { workspace=true }
eframe = { workspace=true }
log = { workspace=true }
egui_json_tree = { workspace = true }
serde = { workspace=true }
fuzzy-matcher = { workspace=true }
surrealdb = { workspace=true }
egui_extras = { workspace=true }
chrono = { workspace=true }
serde_json = { workspace=true }
crossbeam = { workspace=true }
mime_guess = { workspace=true }
futures = { workspace=true }
bytes = { workspace=true }
regex = { workspace=true }
structdiff = { workspace=true }
async-trait = { workspace = true }
egui_dock = {workspace = true}
# rayon-wasm = { workspace = true }
# rayon-wasm = "1.6.2"
# egui_struct = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-openai = { workspace = true}
tokio = { workspace=true, optional = true }
rusty-s3 = { workspace=true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
async-openai-wasm = { workspace = true}
rusty-s3 = { workspace=true, features = ["wasm_bindgen"]}
web-time = { workspace=true, optional = true }
wasm-bindgen = { workspace=true, optional = true }
wasm-bindgen-futures = { workspace=true, optional = true }


