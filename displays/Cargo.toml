[package]
name = "displays"
version = "2.4.1"
edition = "2024"

[features]
default = [ "wasm" ]
tokio = ["dep:tokio"]
wasm = ["dep:wasm-bindgen-futures", "dep:web-time"]

[dependencies]
egui_json_tree = { version = "0.12.0", features = ["serde_json"] }
reqwest = { version = "0.12", features = ["stream", "json"] }
structdiff = {version = "0.7.1", features = ["rustc_hash"]}
rpc-router = "0.1"
schemars = "1"
derivative = "2"
parking_lot = "0.12"
zstd = "0.13"
tap = "1"
compact_str = { version = "0.9.0", features = ["serde"] }

# surrealdb-alpha ={ workspace = true }
surrealdb = { workspace=true }
egui_dock = { workspace=true }
egui-data-table = { workspace = true }
egui_logger = { workspace = true }
base64 = { workspace=true }
egui_plot = { workspace = true }
web-time = { workspace=true }
bincode = { workspace=true } 
anyhow = { workspace=true }
database = { workspace=true }
eframe = { workspace=true }
log = { workspace=true }
serde = { workspace=true }
fuzzy-matcher = { workspace=true }
egui_extras = { workspace=true }
chrono = { workspace=true }
serde_json = { workspace=true }
crossbeam = { workspace=true }
mime_guess = { workspace=true }
futures = { workspace=true }
bytes = { workspace=true }
regex = { workspace=true }
async-trait = { workspace = true }
once_cell = { workspace=true }
rfd = { workspace = true }
itertools = { workspace = true }
brotli = { workspace=true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace=true, optional = true }
ratatui = { workspace = true }
async-openai = { workspace = true}
rusty-s3 = { workspace=true }
ewebsock = { git = "https://github.com/shadowbrok3r/ewebsock.git", version = "0.9.3", features = ["tokio", "tls", "rustls_ring"]}# "tls"
# tokio-tungstenite = { version = "*", default-features = false, features = ["rustls-tls-native-roots"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
async-openai-wasm = { workspace = true}
rusty-s3 = { workspace=true, features = ["wasm_bindgen"]}
web-time = { workspace=true, optional = true }
wasm-bindgen-futures = { workspace=true, optional = true }
wasm-cookies = { workspace = true}
ewebsock = { git = "https://github.com/shadowbrok3r/ewebsock.git", version = "0.9.3", features = ["tls", "rustls_ring"]} # "tls"

