[package]
name = "displays"
version = "0.1.0"
edition = "2024"

[features]
default = [ "wasm" ]
tokio = ["dep:tokio"]
wasm = ["dep:wasm-bindgen-futures", "dep:web-time"]

[dependencies]
parking_lot = "0.12"
zstd = "0.13"
reqwest = { version = "0.12", features = ["stream", "json"] }
rfd = "0.15"
tap = "1"
itertools = "0.14"
structdiff = {version = "0.7.1", features = ["rustc_hash"]}
rpc-router = "0.1"
schemars = "0.8"
derivative = "2"
ratatui = { version = "0.29", default-features = false, features = ["serde", "unstable-widget-ref"]}

egui-data-table = { workspace = true }
base64 = { workspace=true }
egui_plot = { workspace = true }
web-time = { workspace=true }
bincode = { workspace=true } 
anyhow = { workspace=true }
database = { workspace=true }
eframe = { workspace=true }
log = { workspace=true }
serde = { workspace=true }
fuzzy-matcher = { workspace=true }
surrealdb = { workspace=true }
egui_extras = { workspace=true }
chrono = { workspace=true }
serde_json = { workspace=true }
crossbeam = { workspace=true }
mime_guess = { workspace=true }
futures = { workspace=true }
bytes = { workspace=true }
regex = { workspace=true }
async-trait = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ratatui = { workspace = true }
async-openai = { workspace = true}
tokio = { workspace=true, optional = true }
rusty-s3 = { workspace=true }
ewebsock = { git = "https://github.com/shadowbrok3r/ewebsock.git", version = "0.9.3", features = ["tokio", "tls", "rustls_ring"]}# "tls"
# tokio-tungstenite = { version = "*", default-features = false, features = ["rustls-tls-native-roots"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
async-openai-wasm = { workspace = true}
rusty-s3 = { workspace=true, features = ["wasm_bindgen"]}
web-time = { workspace=true, optional = true }
wasm-bindgen-futures = { workspace=true, optional = true }
ewebsock = { git = "https://github.com/shadowbrok3r/ewebsock.git", version = "0.9.3", features = ["tls", "rustls_ring"]} # "tls"