[package]
name = "qc_app"
version = "0.1.0"
edition = "2024"
description = "Mastertech QC"
build = "build.rs"

[package.metadata]
icon = ["src/assets/QcApp.ico"]
resources = ["src/assets/**/*png", "src/assets/**/*ico"]

[features]
# egui_skia software renderer; off by default. See Mastertech4.0/BUILD.md.
skia-render = ["dep:egui_skia", "dep:skia-safe", "dep:softbuffer", "dep:winit", "dep:raw-window-handle"]

[dependencies]
eframe = { version = "0.36", features = ["persistence", "serde", "default_fonts", "glow", "links"], default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
egui-phosphor = { version = "0.12.0", default-features = false, features = ["regular"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls", "stream"] }
egui_skia = { git = "https://github.com/shadowbrok3r/egui_skia", features = ["winit", "cpu_fix"], optional = true }
sysinfo = { version = "0.39", features = ["serde", "multithread"] }
stress-kit = { workspace = true, features = ["hw-sensors", "schemars"] }
crossterm = { version = "0.29", features = ["event-stream"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
winit = { version = "0.30", features = ["rwh_06"], optional = true }
raw-window-handle = { version = "0.6", optional = true }
directories = "6.0.0"
softbuffer = { version = "0.4", optional = true }
skia-safe = { version = "0.99", optional = true }
toml = "1"
image = "0.25"
sha2 = "0.10"
hex = "0.4"
egui_plot.workspace = true
web-time.workspace = true
stress-runner.workspace = true
mtech-ui = { workspace = true, features = ["stress-ui"] }
mtech-tui.workspace = true
ratatui.workspace = true
database.workspace = true
egui-data-table.workspace = true
egui_extras.workspace = true
egui_dock.workspace = true
log.workspace = true
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
rmcp.workspace = true
axum.workspace = true
crossbeam.workspace = true
once_cell.workspace = true
futures.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
eframe = { version = "0.36", features = ["x11", "wayland", "links"], default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_System",
    "Win32",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
]}
wmi = "=0.18.3"

[dependencies.egui]
version = "0.36"
default-features = false
features = ["rayon", "bytemuck"]

[target.'cfg(target_os = "windows")'.build-dependencies]
dotenvy = { workspace = true }
static_vcruntime = "3"
embed-resource = "3"
winres = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
openssl-sys = "0.9"
