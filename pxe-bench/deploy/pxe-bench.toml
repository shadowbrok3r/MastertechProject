# pxe-bench appliance config for the Ubuntu bench host.
# server_ip MUST be this box's IPv4 on the bench segment — the address PXE
# clients fetch boot files from. Confirm with:  ip -4 addr show
server_ip = "192.168.22.15"

# Payload roots on a plain ext4 path (no loop-image/noexec complications).
tftp_root = "/srv/pxe/tftp"
http_root = "/srv/pxe/http"
http_port = 7777

bios_boot_file = "undionly.kpxe"
# snponly.efi uses the UEFI firmware's own NIC driver (SNP) — stable on modern
# hardware. Switch to "ipxe.efi" (iPXE's built-in drivers) only if an older
# UEFI box won't network-boot with snponly. Both are staged by stage-payload.sh.
uefi_boot_file = "snponly.efi"
ipxe_script = "boot.ipxe"

# What boot.ipxe presents once iPXE is running:
#   "menu"  — pick WinPE / UEFI diagnostics / local disk (default)
#   "winpe" — straight to the WinPE terminal image
#   "uefi"  — straight to the Mastertech UEFI app (uefi_efi)
boot_mode = "menu"
# EFI app served from http_root and chainloaded for the UEFI menu entry.
uefi_efi = "mtech.efi"
