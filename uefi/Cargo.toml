[package]
name = "uefi-app"
version = "0.1.0"
edition = "2024"

[dependencies]
uefi = { version = "0.39.0", features = ["alloc"] }
uefi-raw = "0.15.1"
smoltcp = { version = "0.13.1", default-features = false, features = ["medium-ethernet", "proto-ipv4", "socket-tcp", "alloc", "log"] }
# default-features=false drops crossterm (custom UEFI backend) and layout-cache;
# re-enable layout-cache + std for v0.30.1 perf (cached splits, iterator BufferDiff).
ratatui = { version = "0.30.2", default-features = false, features = ["layout-cache", "std"] }
terminput = { version = "0.5.15", default-features = false }
# Pure-Rust WASM interpreter (no JIT) for running Mastertech plugins in
# firmware. no_std + alloc; libm for float ops, btree collections to avoid a
# getrandom-backed hasher that UEFI can't satisfy.
wasmi = { version = "2.0.0-beta.8", default-features = false, features = ["libm", "validate", "prefer-btree-collections"] }
# Shared admin↔client wire types; the preboot module (serde + bincode) streams
# the firmware TUI to the admin console's RataguiBackend. tokio/socket2 in this
# crate are gated off the uefi target.
tcp_protocol = { path = "../tcp_protocol" }
ratatui-uefi = { path = "crates/ratatui-uefi" }
terminput-uefi = { path = "crates/terminput-uefi" }
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true

# Excluded from the root workspace (own toolchain/target), so this crate is its
# own workspace root and provides the deps inherited above.
[workspace]
members = ["crates/ratatui-uefi", "crates/terminput-uefi"]

[workspace.dependencies]
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
