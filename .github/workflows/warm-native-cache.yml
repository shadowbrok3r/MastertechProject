name: Warm native build cache

# Builds the release binaries on main and saves the cache release.yml's tag runs restore.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

env:
  # Force cargo's downloader onto HTTP/1.1; HTTP/2 multiplexing intermittently
  # fails crates.io downloads on the runners ("[16] Error in the HTTP2 framing layer").
  CARGO_HTTP_MULTIPLEXING: "false"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  warm:
    name: Warm ${{ matrix.artifact }}
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin: MasterTech
            artifact: Mastertech-linux
            runs_on: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: MasterTech
            artifact: Mastertech.exe
            runs_on: windows-latest
            # The shipped exe carries the egui_skia software renderer, so the
            # GPU -> software -> terminal fallback ladder has its middle rung on
            # customer machines. Without it `--cpu` drops straight to terminal mode.
            features: skia-render
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: qc_app
            artifact: qc_app.exe
            runs_on: windows-latest
    env:
      # .cargo/config.toml points the msvc linker at a local LLVM install; the
      # runner image is not guaranteed to ship lld-link at that path, so keep CI
      # on the MSVC linker. Inert for the linux matrix entry (target-scoped).
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: link.exe
      SCAFFOLD_USER: ${{ secrets.SCAFFOLD_USER }}
      SCAFFOLD_PASS: ${{ secrets.SCAFFOLD_PASS }}
      SCAFFOLD_URL: ${{ secrets.SCAFFOLD_URL }}
      DB_URL: ${{ secrets.DB_URL }}
      STORAGE_URL: ${{ secrets.STORAGE_URL }}
      REGION: ${{ secrets.REGION }}
      DB_URL_DEV: ${{ secrets.DB_URL_DEV }}
      DB_URL_BETA: ${{ secrets.DB_URL_BETA }}
      WS_CLIENT_URL: ${{ secrets.WS_CLIENT_URL }}
      WS_MASTER_URL: ${{ secrets.WS_MASTER_URL }}
      USER_SCOPE: ${{ secrets.USER_SCOPE }}
      DB: ${{ secrets.DB }}
      NS: ${{ secrets.NS }}
      ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
      ODOO_JSONRPC_URL: ${{ secrets.ODOO_JSONRPC_URL }}
      ODOO_DB: ${{ secrets.ODOO_DB }}
      ODOO_UID: ${{ secrets.ODOO_UID }}
      PRESTASHOP_API_URL: ${{ secrets.PRESTASHOP_API_URL }}
      PRESTASHOP_API_URL_WASM: ${{ secrets.PRESTASHOP_API_URL_WASM }}
      SURREAL_GUEST_PASSWORD: ${{ secrets.SURREAL_GUEST_PASSWORD }}
      XIDAX_ADMIN_URL: ${{ secrets.XIDAX_ADMIN_URL }}
      # Fleet orchestrator (axum_server) endpoints. Empty values are allowed
      # — `database::orchestrator_url()` short-circuits fleet reporting at
      # runtime when the active URL is empty. Add the GitHub repo secrets
      # `ORCHESTRATOR_URL` (prod) and `ORCHESTRATOR_URL_DEV` (dev) to enable.
      ORCHESTRATOR_URL: ${{ secrets.ORCHESTRATOR_URL }}
      ORCHESTRATOR_URL_DEV: ${{ secrets.ORCHESTRATOR_URL_DEV }}
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4

      - name: Install PipeWire deps (Linux only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev pkg-config libegl1-mesa-dev libgbm-dev libfreetype6-dev libfontconfig1-dev

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # skia-bindings has no prebuilt binary for this feature set, so it compiles
      # Skia from source via gn/ninja. ninja ships with neither Rust nor MSVC.
      - name: Install ninja for skia-bindings
        if: matrix.features == 'skia-render'
        shell: pwsh
        run: choco install ninja -y --no-progress

      # Cache must come BEFORE the build step that consumes it, otherwise it
      # never speeds anything up.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-mastertech"
          shared-key: "native-${{ matrix.target }}${{ matrix.features && format('-{0}', matrix.features) || '' }}"

      - name: Build
        shell: bash
        run: >-
          cargo build --profile dist --bin "${{ matrix.bin }}" --target "${{ matrix.target }}"
          ${{ matrix.features && format('--features {0}', matrix.features) || '' }}
