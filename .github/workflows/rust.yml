on: [push, pull_request, workflow_dispatch]

name: CI

env:
  RUSTFLAGS: --cfg=web_sys_unstable_apis # -D warnings

jobs:
  trunk:
    name: Build Rust (Trunk)
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: wasm32-unknown-unknown
          override: true

      - name: Download and Install Trunk
        run: wget -qO- https://github.com/trunk-rs/trunk/releases/download/v0.21.5/trunk-x86_64-unknown-linux-musl.tar.gz | tar -xzf-
      - name: Build with Trunk
        working-directory: ./MtechServer2.0  # Move into the correct directory
        run: ../trunk build --release --config Trunk.toml

  docker:
    name: Build and Push Docker Image
    needs: trunk  # Ensure Rust build completes first
    runs-on: self-hosted  # Use self-hosted runner
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: "v0.11.2"  # Stable Buildx version (you can change)
          driver: docker  # Use local Docker engine

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: shadowbrok3r/mtechserver:beta
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || 'type=registry,push=true' }}
