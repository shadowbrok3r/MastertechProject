on: [push, pull_request, workflow_dispatch]

name: CI

env:
  RUSTFLAGS: -C target-feature=+crt-static

jobs:
  build:
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        include:
        # - os: macos-latest
        #   TARGET: x86_64-apple-darwin

        # - os: ubuntu-latest
        #   TARGET: x86_64-unknown-linux-musl

        - os: windows-latest
          TARGET: x86_64-pc-windows-msvc
          EXTENSION: .exe

    steps:
    - name: Building ${{ matrix.TARGET }}
      run: echo "${{ matrix.TARGET }}"
      
    - name: Set Env
      run: echo "{name}={value}" >> $GITHUB_ENV

    - name: Extract version from Cargo.toml
      id: extract_version
      run: |
        version=$(grep '^version' Cargo.toml | head -1 | awk -F '"' '{print $2}')
        echo "version=$version" >> $GITHUB_ENV
        echo "VERSION=$version" > version.txt
      
    - uses: actions/checkout@master
    - uses: actions-rs/toolchain@v1.0.1
      with:
        toolchain: stable
        target: ${{ matrix.TARGET }}
        override: true

    - uses: actions-rs/cargo@v1
      with:
        use-cross: true
        command: build
        args: --verbose --release --target=${{ matrix.TARGET }}

    - name: Rename
      run: cp target/${{ matrix.TARGET }}/release/MasterTech${{ matrix.EXTENSION }} Mastertech${{ matrix.EXTENSION }} # ${{ matrix.TARGET }}

    - uses: actions/upload-artifact@master
      with:
        name: Mastertech${{ matrix.EXTENSION }} # ${{ matrix.TARGET }}
        path: Mastertech${{ matrix.EXTENSION }} # ${{ matrix.TARGET }}

    - name: Create tag
      if: ${{ github.event_name == 'push' }}
      run: |
        git tag v${{ env.version }}
        git push origin v${{ env.version }}

    - uses: svenstaro/upload-release-action@v2
      name: Upload binaries to release
      if: ${{ github.event_name == 'push' }}
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: Mastertech-${{ matrix.EXTENSION }} # ${{ matrix.TARGET }}
        asset_name: Mastertech-${{ matrix.EXTENSION }} # ${{ matrix.TARGET }}
        tag: v${{ env.version }}
        # prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
        overwrite: true

    - name: Create Release
      id: create_release
      uses: actions/create-release@latest
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Mastertech v${{ env.version }}
        body: |
          ${{ steps.Changelog.outputs.changelog }}
        draft: false
        prerelease: false

    - name: Changelog
      uses: scottbrenner/generate-changelog-action@master
      id: Changelog
      env:
        REPO: ${{ github.repository }}
