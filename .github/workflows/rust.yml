on: [push, pull_request, workflow_dispatch]

name: CI

env:
  RUSTFLAGS: -C target-feature=+crt-static

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        # - os: macos-latest
        #   TARGET: aarch64-apple-darwin

        # - os: macos-latest
        #   TARGET: x86_64-apple-darwin

        # - os: ubuntu-latest
        #   TARGET: x86_64-unknown-linux-musl

        - os: windows-latest
          TARGET: x86_64-pc-windows-msvc
          EXTENSION: .exe

    steps:
    - name: Building ${{ matrix.TARGET }}
      run: echo "${{ matrix.TARGET }}"

    - uses: actions/checkout@master
    - uses: actions-rs/toolchain@v1.0.1
      with:
        toolchain: stable
        target: ${{ matrix.TARGET }}
        override: true

    - uses: actions-rs/cargo@v1
      with:
        use-cross: true
        command: build
        args: --verbose --release --target=${{ matrix.TARGET }}

    - name: Rename
      run: cp target/${{ matrix.TARGET }}/release/MasterTech${{ matrix.EXTENSION }} Mastertech${{ matrix.EXTENSION }} # ${{ matrix.TARGET }}

    - uses: actions/upload-artifact@master
      with:
        name: Mastertech${{ matrix.EXTENSION }} # ${{ matrix.TARGET }}
        path: Mastertech${{ matrix.EXTENSION }} # ${{ matrix.TARGET }}


    - uses: svenstaro/upload-release-action@v2
      name: Upload binaries to release
      if: ${{ github.event_name == 'push' }}
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: Mastertech-${{ matrix.EXTENSION }} # ${{ matrix.TARGET }}
        asset_name: Mastertech-${{ matrix.EXTENSION }} # ${{ matrix.TARGET }}
        tag: ${{ github.ref }}
        # prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
        overwrite: true

    - name: Create Release
      id: create_release
      uses: actions/create-release@latest
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Mastertech 4.1.  # ${{ github. }}
        body: |
          ${{ steps.Changelog.outputs.changelog }}
        draft: false
        prerelease: false

    - name: Changelog
      uses: scottbrenner/generate-changelog-action@master
      id: Changelog
      env:
        REPO: ${{ github.repository }}
