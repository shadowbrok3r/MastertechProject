name: Release

permissions:
  contents: write

on:
  push:
    branches:
      - '**'
    tags:
      - '4.*'
  pull_request:
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1.9.1
        with:
          title: MasterTech $tag
          allow-missing-changelog: true
          token: ${{ secrets.GITHUB_TOKEN }}

  native-build:
    name: Build and Upload Native Binaries
    needs: create-release
    # Only run on tag pushes so we don't burn minutes on every branch push.
    # The beta workflow (trunk + docker below) is the one we want firing
    # on every push.
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin: MasterTech
            artifact: Mastertech-linux
            runs_on: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: MasterTech
            artifact: Mastertech.exe
            runs_on: windows-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: qc_app
            artifact: qc_app.exe
            runs_on: windows-latest
    env:
      SCAFFOLD_USER: ${{ secrets.SCAFFOLD_USER }}
      SCAFFOLD_PASS: ${{ secrets.SCAFFOLD_PASS }}
      SCAFFOLD_URL: ${{ secrets.SCAFFOLD_URL }}
      DB_URL: ${{ secrets.DB_URL }}
      STORAGE_URL: ${{ secrets.STORAGE_URL }}
      REGION: ${{ secrets.REGION }}
      DB_URL_DEV: ${{ secrets.DB_URL_DEV }}
      DB_URL_BETA: ${{ secrets.DB_URL_BETA }}
      WS_CLIENT_URL: ${{ secrets.WS_CLIENT_URL }}
      WS_MASTER_URL: ${{ secrets.WS_MASTER_URL }}
      USER_SCOPE: ${{ secrets.USER_SCOPE }}
      DB: ${{ secrets.DB }}
      NS: ${{ secrets.NS }}
      ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
      ODOO_JSONRPC_URL: ${{ secrets.ODOO_JSONRPC_URL }}
      ODOO_DB: ${{ secrets.ODOO_DB }}
      ODOO_UID: ${{ secrets.ODOO_UID }}
      PRESTASHOP_API_URL: ${{ secrets.PRESTASHOP_API_URL }}
      PRESTASHOP_API_URL_WASM: ${{ secrets.PRESTASHOP_API_URL_WASM }}
      SURREAL_GUEST_PASSWORD: ${{ secrets.SURREAL_GUEST_PASSWORD }}
      XIDAX_ADMIN_URL: ${{ secrets.XIDAX_ADMIN_URL }}
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4

      - name: Install PipeWire deps (Linux only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev pkg-config libegl1-mesa-dev libgbm-dev

      - name: Install Rust Toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: ${{ matrix.target }}
          override: true

      - name: Upload Binary to GitHub Release
        uses: taiki-e/upload-rust-binary-action@v1.27.0
        with:
          bin: ${{ matrix.bin }}
          target: ${{ matrix.target }}
          tar: none
          zip: none
          token: ${{ secrets.GITHUB_TOKEN }}
          asset: target/${{ matrix.target }}/release/${{ matrix.bin }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-mastertech"
          shared-key: "native-${{ matrix.target }}"

  trunk:
    name: Build WASM frontend (Trunk)
    runs-on: ubuntu-latest
    env:
      SCAFFOLD_USER: ${{ secrets.SCAFFOLD_USER }}
      SCAFFOLD_PASS: ${{ secrets.SCAFFOLD_PASS }}
      SCAFFOLD_URL: ${{ secrets.SCAFFOLD_URL }}
      DB_URL: ${{ secrets.DB_URL }}
      STORAGE_URL: ${{ secrets.STORAGE_URL }}
      REGION: ${{ secrets.REGION }}
      DB_URL_DEV: ${{ secrets.DB_URL_DEV }}
      DB_URL_BETA: ${{ secrets.DB_URL_BETA }}
      WS_CLIENT_URL: ${{ secrets.WS_CLIENT_URL }}
      WS_MASTER_URL: ${{ secrets.WS_MASTER_URL }}
      USER_SCOPE: ${{ secrets.USER_SCOPE }}
      DB: ${{ secrets.DB }}
      NS: ${{ secrets.NS }}
      ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
      ODOO_JSONRPC_URL: ${{ secrets.ODOO_JSONRPC_URL }}
      ODOO_DB: ${{ secrets.ODOO_DB }}
      ODOO_UID: ${{ secrets.ODOO_UID }}
      PRESTASHOP_API_URL: ${{ secrets.PRESTASHOP_API_URL }}
      PRESTASHOP_API_URL_WASM: ${{ secrets.PRESTASHOP_API_URL_WASM }}
      SURREAL_GUEST_PASSWORD: ${{ secrets.SURREAL_GUEST_PASSWORD }}
      XIDAX_ADMIN_URL: ${{ secrets.XIDAX_ADMIN_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust Toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: nightly
          target: wasm32-unknown-unknown
          override: true
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-mastertech"
          shared-key: "wasm"
          workspaces: "MtechServer2.0 -> target"

      - name: Download and Install Trunk
        run: wget -qO- https://github.com/trunk-rs/trunk/releases/download/v0.22.0-beta.1/trunk-x86_64-unknown-linux-musl.tar.gz | tar -xzf-

      - name: Build with Trunk
        working-directory: ./MtechServer2.0
        run: ../trunk build --release --config Trunk.toml

  docker:
    name: Build and Push Docker Image (:beta)
    needs: trunk
    runs-on: ubuntu-latest
    # Build the beta image on every push to any branch, but never on a
    # pull_request (those run with restricted secrets and can't push).
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Materialise .env for Docker build context
        run: |
          cat > .env << 'ENVEOF'
          USER_SCOPE=${{ secrets.USER_SCOPE }}
          DB=${{ secrets.DB }}
          NS=${{ secrets.NS }}
          SCAFFOLD_URL=${{ secrets.SCAFFOLD_URL }}
          SCAFFOLD_USER=${{ secrets.SCAFFOLD_USER }}
          SCAFFOLD_PASS=${{ secrets.SCAFFOLD_PASS }}
          DB_URL=${{ secrets.DB_URL }}
          STORAGE_URL=${{ secrets.STORAGE_URL }}
          REGION=${{ secrets.REGION }}
          DB_URL_DEV=${{ secrets.DB_URL_DEV }}
          DB_URL_BETA=${{ secrets.DB_URL_BETA }}
          WS_CLIENT_URL=${{ secrets.WS_CLIENT_URL }}
          WS_MASTER_URL=${{ secrets.WS_MASTER_URL }}
          ODOO_API_KEY=${{ secrets.ODOO_API_KEY }}
          ODOO_JSONRPC_URL=${{ secrets.ODOO_JSONRPC_URL }}
          ODOO_DB=${{ secrets.ODOO_DB }}
          ODOO_UID=${{ secrets.ODOO_UID }}
          PRESTASHOP_API_URL=${{ secrets.PRESTASHOP_API_URL }}
          PRESTASHOP_API_URL_WASM=${{ secrets.PRESTASHOP_API_URL_WASM }}
          SURREAL_GUEST_PASSWORD=${{ secrets.SURREAL_GUEST_PASSWORD }}
          XIDAX_ADMIN_URL=${{ secrets.XIDAX_ADMIN_URL }}
          ENVEOF

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            shadowbrok3r/mtechserver:beta
            shadowbrok3r/mtechserver:beta-${{ github.sha }}
          outputs: type=registry,push=true

  docker-services-beta:
    name: Build and Push service images (:beta)
    runs-on: ubuntu-latest
    # Same trigger discipline as the `docker` job: every push that
    # isn't a PR. Runs in parallel with `trunk` — neither image needs
    # the WASM frontend, so we don't gate on it.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: axum_server
            image: shadowbrok3r/axum_server
            dockerfile: ./axum_server/Dockerfile
          - name: plugin_builder
            image: shadowbrok3r/plugin_builder
            dockerfile: ./plugin_builder/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Materialise .env for Docker build context
        # Both images COPY the repo root into their build context and
        # link against `database`, whose build.rs panics at compile time
        # without these env! values. Same heredoc trick the
        # `docker-servers` job uses — single-quoted EOF stops the shell
        # from re-expanding `$`-prefixed secret values after GHA has
        # already substituted the ${{ }} expressions.
        run: |
          cat > .env << 'ENVEOF'
          USER_SCOPE=${{ secrets.USER_SCOPE }}
          DB=${{ secrets.DB }}
          NS=${{ secrets.NS }}
          SCAFFOLD_URL=${{ secrets.SCAFFOLD_URL }}
          SCAFFOLD_USER=${{ secrets.SCAFFOLD_USER }}
          SCAFFOLD_PASS=${{ secrets.SCAFFOLD_PASS }}
          DB_URL=${{ secrets.DB_URL }}
          STORAGE_URL=${{ secrets.STORAGE_URL }}
          REGION=${{ secrets.REGION }}
          DB_URL_DEV=${{ secrets.DB_URL_DEV }}
          DB_URL_BETA=${{ secrets.DB_URL_BETA }}
          WS_CLIENT_URL=${{ secrets.WS_CLIENT_URL }}
          WS_MASTER_URL=${{ secrets.WS_MASTER_URL }}
          ODOO_API_KEY=${{ secrets.ODOO_API_KEY }}
          ODOO_JSONRPC_URL=${{ secrets.ODOO_JSONRPC_URL }}
          ODOO_DB=${{ secrets.ODOO_DB }}
          ODOO_UID=${{ secrets.ODOO_UID }}
          PRESTASHOP_API_URL=${{ secrets.PRESTASHOP_API_URL }}
          PRESTASHOP_API_URL_WASM=${{ secrets.PRESTASHOP_API_URL_WASM }}
          SURREAL_GUEST_PASSWORD=${{ secrets.SURREAL_GUEST_PASSWORD }}
          XIDAX_ADMIN_URL=${{ secrets.XIDAX_ADMIN_URL }}
          ENVEOF

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build and Push ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:beta
            ${{ matrix.image }}:beta-${{ github.sha }}
          outputs: type=registry,push=true

  docker-servers:
    name: Build and Push server images (:latest)
    runs-on: ubuntu-latest
    # Only push tagged releases; never runs on PRs (no Docker Hub secret access).
    if: startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: websocket_server2
            image: shadowbrok3r/websocket_server2
            dockerfile: ./websocket_server2/Dockerfile
          - name: axum_server
            image: shadowbrok3r/axum_server
            dockerfile: ./axum_server/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Materialise .env for Docker build context
        # database/build.rs panics at compile time without these keys; write
        # them from secrets into the .env that each Dockerfile COPYs into the
        # build context. The quoted heredoc ('ENVEOF') prevents bash from
        # expanding $-prefixed secret values while GHA has already substituted
        # the ${{ }} expressions before passing the script to the shell.
        run: |
          cat > .env << 'ENVEOF'
          USER_SCOPE=${{ secrets.USER_SCOPE }}
          DB=${{ secrets.DB }}
          NS=${{ secrets.NS }}
          SCAFFOLD_URL=${{ secrets.SCAFFOLD_URL }}
          SCAFFOLD_USER=${{ secrets.SCAFFOLD_USER }}
          SCAFFOLD_PASS=${{ secrets.SCAFFOLD_PASS }}
          DB_URL=${{ secrets.DB_URL }}
          STORAGE_URL=${{ secrets.STORAGE_URL }}
          REGION=${{ secrets.REGION }}
          DB_URL_DEV=${{ secrets.DB_URL_DEV }}
          DB_URL_BETA=${{ secrets.DB_URL_BETA }}
          WS_CLIENT_URL=${{ secrets.WS_CLIENT_URL }}
          WS_MASTER_URL=${{ secrets.WS_MASTER_URL }}
          ODOO_API_KEY=${{ secrets.ODOO_API_KEY }}
          ODOO_JSONRPC_URL=${{ secrets.ODOO_JSONRPC_URL }}
          ODOO_DB=${{ secrets.ODOO_DB }}
          ODOO_UID=${{ secrets.ODOO_UID }}
          PRESTASHOP_API_URL=${{ secrets.PRESTASHOP_API_URL }}
          PRESTASHOP_API_URL_WASM=${{ secrets.PRESTASHOP_API_URL_WASM }}
          SURREAL_GUEST_PASSWORD=${{ secrets.SURREAL_GUEST_PASSWORD }}
          XIDAX_ADMIN_URL=${{ secrets.XIDAX_ADMIN_URL }}
          ENVEOF

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build and Push ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.ref_name }}

