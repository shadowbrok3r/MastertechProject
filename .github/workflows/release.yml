name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - '4.*'
  pull_request:
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1.9.1
        with:
          title: MasterTech $tag
          allow-missing-changelog: true
          token: ${{ secrets.GITHUB_TOKEN }}

  native-build:
    name: Build and Upload Native Binaries
    needs: create-release
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin: MasterTech         # ← crate binary name
            artifact: Mastertech-linux  # ← renamed file for upload
            runs_on: self-hosted
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: MasterTech
            artifact: Mastertech.exe
            runs_on: windows-latest

    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4

      - name: Install PipeWire deps (Linux only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          echo ${{ secrets.USERPWD }} | sudo -S apt-get update
          echo ${{ secrets.USERPWD }} | sudo -S apt-get install -y libpipewire-0.3-dev pkg-config libegl1-mesa-dev libgbm-dev
      
      - name: Install Rust Toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: ${{ matrix.target }}
          override: true

      - name: Upload Binary to GitHub Release
        uses: taiki-e/upload-rust-binary-action@v1.27.0
        with:
          bin: ${{ matrix.bin }}
          target: ${{ matrix.target }}
          tar: none
          zip: none
          token: ${{ secrets.GITHUB_TOKEN }}
          asset: target/${{ matrix.target }}/release/${{ matrix.bin }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-mastertech"
          shared-key: "native-${{ matrix.target }}"

  trunk:
    name: Build WASM frontend (Trunk)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust Toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: nightly
          target: wasm32-unknown-unknown
          override: true
          components: rust-src 

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-mastertech"
          shared-key: "wasm"
          # specific cache setting for workspace member
          workspaces: "MtechServer2.0 -> target" 

      - name: Download and Install Trunk
        # Ensure this version matches what you use locally. 
        # If possible, use the same version defined in your Dockerfile if it installs Trunk.
        run: wget -qO- https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-musl.tar.gz | tar -xzf-
      
      - name: Build with Trunk
        working-directory: ./MtechServer2.0
        # Trunk will automatically look up the directory tree, find the 
        # root .cargo/config.toml, and apply the atomic/wasm flags.
        run: ../trunk build --release --config Trunk.toml

  docker:
    name: Build and Push Docker Image
    needs: trunk
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: "v0.11.2"
          driver: docker

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: shadowbrok3r/mtechserver:beta
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || 'type=registry,push=true' }}

