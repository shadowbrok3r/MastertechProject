name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - v[0-9]+.*
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  trunk:
    name: Build WASM frontend (Trunk)
    runs-on: self-hosted
    env:
      RUSTFLAGS: -C target-feature=+atomics,+bulk-memory,+mutable-globals --cfg=getrandom_backend="wasm_js"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: wasm32-unknown-unknown
          override: true

      - name: Download and Install Trunk
        run: wget -qO- https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-musl.tar.gz | tar -xzf-

      - name: Patch Cargo.toml (remove Mastertech4.0)
        run: |
          sed -i -E 's/"Mastertech4\.0",?\s*//g; s/\[\s*,/\[/; s/,\s*\]/]/; s/"\s*"/", "/g' Cargo.toml

      - name: Build with Trunk
        working-directory: ./MtechServer2.0
        run: ../trunk build --release --config Trunk.toml

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: mtechserver-wasm
          path: ./MtechServer2.0/dist/mtechserver.wasm

  docker:
    name: Build and Push Docker Image
    needs: trunk
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: "v0.11.2"
          driver: docker

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: shadowbrok3r/mtechserver:beta
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || 'type=registry,push=true' }}

  # Uncomment to enable Kubernetes deployment step
  # deploy:
  #   name: Deploy to Kubernetes
  #   needs: docker
  #   runs-on: self-hosted
  #   steps:
  #     - uses: ghostzero/kubectl@v1
  #       env:
  #         KUBE_CONFIG_DATA: ${{ secrets.KUBECONFIG }}
  #       with:
  #         args: rollout restart deployment mtechserver-beta -n rust

  native-build:
    name: Build and Upload Native Binaries
    needs: trunk
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            package: Mastertech4.0
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            package: Mastertech4.0
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Native Binary
        run: cargo build --release --target=${{ matrix.target }} -p ${{ matrix.package }}

      - name: Upload Native Binary to Release
        uses: taiki-e/upload-rust-binary-action@v1.27.0
        with:
          bin: Mastertech
          target: ${{ matrix.target }}
          token: ${{ secrets.GITHUB_TOKEN }}
          tar: none
          zip: none

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [trunk, native-build]
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1.9.1
        with:
          changelog: CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}
