name: Release

permissions:
  contents: write

on:
  push:
    branches:
      - '**'
    tags:
      - '4.*'
  pull_request:
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Force cargo's downloader onto HTTP/1.1; HTTP/2 multiplexing intermittently
  # fails crates.io downloads on the runners ("[16] Error in the HTTP2 framing layer").
  CARGO_HTTP_MULTIPLEXING: "false"

# Cancel superseded runs on the same branch/PR, but never cancel tag (release)
# runs partway through.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1.9.1
        with:
          title: MasterTech $tag
          allow-missing-changelog: true
          token: ${{ secrets.GITHUB_TOKEN }}

  native-build:
    name: Build and Upload Native Binaries
    needs: create-release
    # Only run on tag pushes so we don't burn minutes on every branch push.
    # The beta workflow (trunk + docker below) is the one we want firing
    # on every push.
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin: MasterTech
            artifact: Mastertech-linux
            runs_on: '"ubuntu-latest"'
          # Windows builds run on the self-hosted runner, whose toolchain and target dir persist under E:\gh-runner.
          - target: x86_64-pc-windows-msvc
            os: windows
            bin: MasterTech
            artifact: Mastertech.exe
            runs_on: '["self-hosted", "Windows", "X64", "work"]'
            self_hosted: true
            # The shipped exe carries the egui_skia software renderer, so the
            # GPU -> software -> terminal fallback ladder has its middle rung on
            # customer machines. Without it `--cpu` drops straight to terminal mode.
            features: skia-render
          - target: x86_64-pc-windows-msvc
            os: windows
            bin: qc_app
            artifact: qc_app.exe
            runs_on: '["self-hosted", "Windows", "X64", "work"]'
            self_hosted: true
    env:
      # .cargo/config.toml points the msvc linker at a local LLVM install; the
      # runner image is not guaranteed to ship lld-link at that path, so keep CI
      # on the MSVC linker. Inert for the linux matrix entry (target-scoped).
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: link.exe
      SCAFFOLD_USER: ${{ secrets.SCAFFOLD_USER }}
      SCAFFOLD_PASS: ${{ secrets.SCAFFOLD_PASS }}
      SCAFFOLD_URL: ${{ secrets.SCAFFOLD_URL }}
      DB_URL: ${{ secrets.DB_URL }}
      STORAGE_URL: ${{ secrets.STORAGE_URL }}
      REGION: ${{ secrets.REGION }}
      DB_URL_DEV: ${{ secrets.DB_URL_DEV }}
      DB_URL_BETA: ${{ secrets.DB_URL_BETA }}
      WS_CLIENT_URL: ${{ secrets.WS_CLIENT_URL }}
      WS_MASTER_URL: ${{ secrets.WS_MASTER_URL }}
      USER_SCOPE: ${{ secrets.USER_SCOPE }}
      DB: ${{ secrets.DB }}
      NS: ${{ secrets.NS }}
      ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
      ODOO_JSONRPC_URL: ${{ secrets.ODOO_JSONRPC_URL }}
      ODOO_DB: ${{ secrets.ODOO_DB }}
      ODOO_UID: ${{ secrets.ODOO_UID }}
      PRESTASHOP_API_URL: ${{ secrets.PRESTASHOP_API_URL }}
      PRESTASHOP_API_URL_WASM: ${{ secrets.PRESTASHOP_API_URL_WASM }}
      SURREAL_GUEST_PASSWORD: ${{ secrets.SURREAL_GUEST_PASSWORD }}
      XIDAX_ADMIN_URL: ${{ secrets.XIDAX_ADMIN_URL }}
      # Fleet orchestrator (axum_server) endpoints. Empty values are allowed
      # — `database::orchestrator_url()` short-circuits fleet reporting at
      # runtime when the active URL is empty. Add the GitHub repo secrets
      # `ORCHESTRATOR_URL` (prod) and `ORCHESTRATOR_URL_DEV` (dev) to enable.
      ORCHESTRATOR_URL: ${{ secrets.ORCHESTRATOR_URL }}
      ORCHESTRATOR_URL_DEV: ${{ secrets.ORCHESTRATOR_URL_DEV }}
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    steps:
      - uses: actions/checkout@v4

      # Installs rustup and ninja under E:\gh-runner once, and points cargo's home and target dir there.
      - name: Prepare the self-hosted toolchain
        if: matrix.self_hosted
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $root = 'E:\gh-runner'
          New-Item -ItemType Directory -Force "$root\bin" | Out-Null
          $env:CARGO_HOME = "$root\cargo"
          $env:RUSTUP_HOME = "$root\rustup"
          if (-not (Test-Path "$env:CARGO_HOME\bin\rustup.exe")) {
            Invoke-WebRequest -UseBasicParsing https://win.rustup.rs/x86_64 -OutFile "$root\rustup-init.exe"
            & "$root\rustup-init.exe" -y --no-modify-path --profile minimal --default-toolchain stable
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path "$root\bin\ninja.exe")) {
            Invoke-WebRequest -UseBasicParsing https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-win.zip -OutFile "$root\ninja-win.zip"
            Expand-Archive "$root\ninja-win.zip" -DestinationPath "$root\bin" -Force
          }
          Add-Content -Path $env:GITHUB_ENV -Value "CARGO_HOME=$env:CARGO_HOME"
          Add-Content -Path $env:GITHUB_ENV -Value "RUSTUP_HOME=$env:RUSTUP_HOME"
          Add-Content -Path $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=E:/gh-runner/target"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:CARGO_HOME\bin"
          Add-Content -Path $env:GITHUB_PATH -Value "$root\bin"
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\Git\bin"

      - name: Install PipeWire deps (Linux only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev pkg-config libegl1-mesa-dev libgbm-dev libfreetype6-dev libfontconfig1-dev

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # skia-bindings has no prebuilt binary for this feature set, so it compiles
      # Skia from source via gn/ninja. ninja ships with neither Rust nor MSVC.
      - name: Install ninja for skia-bindings
        if: matrix.features == 'skia-render' && !matrix.self_hosted
        shell: pwsh
        run: choco install ninja -y --no-progress

      # Cache must come BEFORE the build step that consumes it, otherwise it
      # never speeds anything up.
      # Restores the cache warm-native-cache.yml saves on main; saves only on main.
      - uses: Swatinem/rust-cache@v2
        if: ${{ !matrix.self_hosted }}
        with:
          prefix-key: "v1-mastertech"
          shared-key: "native-${{ matrix.target }}${{ matrix.features && format('-{0}', matrix.features) || '' }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        shell: bash
        run: >-
          cargo build --profile dist --bin "${{ matrix.bin }}" --target "${{ matrix.target }}"
          ${{ matrix.features && format('--features {0}', matrix.features) || '' }}

      # The self-updater wants a `.exe` asset whose name starts with the package
      # name on Windows and a `-linux` suffix on Linux, so upload as `artifact`.
      - name: Upload Binary to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          src="${CARGO_TARGET_DIR:-target}/${{ matrix.target }}/dist/${{ matrix.bin }}"
          if [[ "${{ matrix.target }}" == *windows* ]]; then src="${src}.exe"; fi
          cp "${src}" "${{ matrix.artifact }}"
          gh release upload "${GITHUB_REF_NAME}" "${{ matrix.artifact }}" --clobber

  trunk:
    name: Build WASM frontend (Trunk)
    runs-on: ubuntu-latest
    env:
      SCAFFOLD_USER: ${{ secrets.SCAFFOLD_USER }}
      SCAFFOLD_PASS: ${{ secrets.SCAFFOLD_PASS }}
      SCAFFOLD_URL: ${{ secrets.SCAFFOLD_URL }}
      DB_URL: ${{ secrets.DB_URL }}
      STORAGE_URL: ${{ secrets.STORAGE_URL }}
      REGION: ${{ secrets.REGION }}
      DB_URL_DEV: ${{ secrets.DB_URL_DEV }}
      DB_URL_BETA: ${{ secrets.DB_URL_BETA }}
      WS_CLIENT_URL: ${{ secrets.WS_CLIENT_URL }}
      WS_MASTER_URL: ${{ secrets.WS_MASTER_URL }}
      USER_SCOPE: ${{ secrets.USER_SCOPE }}
      DB: ${{ secrets.DB }}
      NS: ${{ secrets.NS }}
      ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
      ODOO_JSONRPC_URL: ${{ secrets.ODOO_JSONRPC_URL }}
      ODOO_DB: ${{ secrets.ODOO_DB }}
      ODOO_UID: ${{ secrets.ODOO_UID }}
      PRESTASHOP_API_URL: ${{ secrets.PRESTASHOP_API_URL }}
      PRESTASHOP_API_URL_WASM: ${{ secrets.PRESTASHOP_API_URL_WASM }}
      SURREAL_GUEST_PASSWORD: ${{ secrets.SURREAL_GUEST_PASSWORD }}
      XIDAX_ADMIN_URL: ${{ secrets.XIDAX_ADMIN_URL }}
      # Fleet orchestrator (axum_server) endpoints. Empty values are allowed
      # — `database::orchestrator_url()` short-circuits fleet reporting at
      # runtime when the active URL is empty. Add the GitHub repo secrets
      # `ORCHESTRATOR_URL` (prod) and `ORCHESTRATOR_URL_DEV` (dev) to enable.
      ORCHESTRATOR_URL: ${{ secrets.ORCHESTRATOR_URL }}
      ORCHESTRATOR_URL_DEV: ${{ secrets.ORCHESTRATOR_URL_DEV }}
      # Commit stamp for build_hash.rs when git is unavailable.
      BUILD_GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-mastertech"
          shared-key: "wasm"
          workspaces: "MtechServer2.0 -> target"

      - name: Download and Install Trunk
        run: wget -qO- https://github.com/trunk-rs/trunk/releases/download/v0.22.0-beta.1/trunk-x86_64-unknown-linux-musl.tar.gz | tar -xzf-

      # `--locked` fails the build when Cargo.lock is stale.
      - name: Build with Trunk
        working-directory: ./MtechServer2.0
        run: ../trunk build --release --locked --config Trunk.toml

      - name: Pre-compress dist for nginx gzip_static
        working-directory: ./MtechServer2.0
        run: ../deploy/precompress.sh dist

      - name: Upload dist for the image build
        uses: actions/upload-artifact@v4
        with:
          name: mtechserver-dist
          path: MtechServer2.0/dist
          retention-days: 1
          if-no-files-found: error
          # Contents are already gzipped.
          compression-level: 1

  docker:
    name: Build and Push Docker Image (:beta)
    needs: trunk
    runs-on: ubuntu-latest
    # Build the beta image on every push to any branch, but never on a
    # pull_request (those run with restricted secrets and can't push).
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Download prebuilt dist
        uses: actions/download-artifact@v4
        with:
          name: mtechserver-dist
          path: MtechServer2.0/dist

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          # Serves the trunk job's dist; a named context bypasses the `**/dist/` ignore.
          target: prebuilt
          build-contexts: |
            dist=./MtechServer2.0/dist
          # Read only by the from-source `runtime` target.
          build-args: |
            GIT_SHA=${{ github.sha }}
          push: true
          tags: |
            shadowbrok3r/mtechserver:beta
            shadowbrok3r/mtechserver:beta-${{ github.sha }}
          outputs: type=registry,push=true
          cache-from: type=gha,scope=mtechserver
          cache-to: type=gha,mode=max,scope=mtechserver

  docker-services-beta:
    name: Build and Push service images (:beta)
    runs-on: ubuntu-latest
    # Same trigger discipline as the `docker` job: every push that
    # isn't a PR. Runs in parallel with `trunk` — neither image needs
    # the WASM frontend, so we don't gate on it.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: axum_server
            image: shadowbrok3r/axum_server
            dockerfile: ./axum_server/Dockerfile
          - name: plugin_builder
            image: shadowbrok3r/plugin_builder
            dockerfile: ./plugin_builder/Dockerfile
          # Pushes `websocket_server`, not `websocket_server2`: that is the repo
          # the `websocketserver-beta` deployment pulls from.
          - name: websocket_server2
            image: shadowbrok3r/websocket_server
            dockerfile: ./websocket_server2/Dockerfile
          - name: admin_agent
            image: shadowbrok3r/admin_agent
            dockerfile: ./admin-agent/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Materialise .env for Docker build context
        # Both images COPY the repo root into their build context and
        # link against `database`, whose build.rs panics at compile time
        # without these env! values. Same heredoc trick the
        # `docker-servers` job uses — single-quoted EOF stops the shell
        # from re-expanding `$`-prefixed secret values after GHA has
        # already substituted the ${{ }} expressions.
        run: |
          cat > .env << 'ENVEOF'
          USER_SCOPE=${{ secrets.USER_SCOPE }}
          DB=${{ secrets.DB }}
          NS=${{ secrets.NS }}
          SCAFFOLD_URL=${{ secrets.SCAFFOLD_URL }}
          SCAFFOLD_USER=${{ secrets.SCAFFOLD_USER }}
          SCAFFOLD_PASS=${{ secrets.SCAFFOLD_PASS }}
          DB_URL=${{ secrets.DB_URL }}
          STORAGE_URL=${{ secrets.STORAGE_URL }}
          REGION=${{ secrets.REGION }}
          DB_URL_DEV=${{ secrets.DB_URL_DEV }}
          DB_URL_BETA=${{ secrets.DB_URL_BETA }}
          WS_CLIENT_URL=${{ secrets.WS_CLIENT_URL }}
          WS_MASTER_URL=${{ secrets.WS_MASTER_URL }}
          ODOO_API_KEY=${{ secrets.ODOO_API_KEY }}
          ODOO_JSONRPC_URL=${{ secrets.ODOO_JSONRPC_URL }}
          ODOO_DB=${{ secrets.ODOO_DB }}
          ODOO_UID=${{ secrets.ODOO_UID }}
          PRESTASHOP_API_URL=${{ secrets.PRESTASHOP_API_URL }}
          PRESTASHOP_API_URL_WASM=${{ secrets.PRESTASHOP_API_URL_WASM }}
          SURREAL_GUEST_PASSWORD=${{ secrets.SURREAL_GUEST_PASSWORD }}
          XIDAX_ADMIN_URL=${{ secrets.XIDAX_ADMIN_URL }}
          # Fleet orchestrator: empty values are valid ("fleet reporting disabled").
          # Set the GitHub repo secrets when ready to enable.
          ORCHESTRATOR_URL=${{ secrets.ORCHESTRATOR_URL }}
          ORCHESTRATOR_URL_DEV=${{ secrets.ORCHESTRATOR_URL_DEV }}
          ENVEOF

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build and Push ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:beta
            ${{ matrix.image }}:beta-${{ github.sha }}
          outputs: type=registry,push=true
          cache-from: type=gha,scope=${{ matrix.name }}-beta
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-beta

  docker-servers:
    name: Build and Push server images (:latest)
    runs-on: ubuntu-latest
    # Only push tagged releases; never runs on PRs (no Docker Hub secret access).
    if: startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: websocket_server2
            image: shadowbrok3r/websocket_server2
            dockerfile: ./websocket_server2/Dockerfile
          - name: axum_server
            image: shadowbrok3r/axum_server
            dockerfile: ./axum_server/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Materialise .env for Docker build context
        # database/build.rs panics at compile time without these keys; write
        # them from secrets into the .env that each Dockerfile COPYs into the
        # build context. The quoted heredoc ('ENVEOF') prevents bash from
        # expanding $-prefixed secret values while GHA has already substituted
        # the ${{ }} expressions before passing the script to the shell.
        run: |
          cat > .env << 'ENVEOF'
          USER_SCOPE=${{ secrets.USER_SCOPE }}
          DB=${{ secrets.DB }}
          NS=${{ secrets.NS }}
          SCAFFOLD_URL=${{ secrets.SCAFFOLD_URL }}
          SCAFFOLD_USER=${{ secrets.SCAFFOLD_USER }}
          SCAFFOLD_PASS=${{ secrets.SCAFFOLD_PASS }}
          DB_URL=${{ secrets.DB_URL }}
          STORAGE_URL=${{ secrets.STORAGE_URL }}
          REGION=${{ secrets.REGION }}
          DB_URL_DEV=${{ secrets.DB_URL_DEV }}
          DB_URL_BETA=${{ secrets.DB_URL_BETA }}
          WS_CLIENT_URL=${{ secrets.WS_CLIENT_URL }}
          WS_MASTER_URL=${{ secrets.WS_MASTER_URL }}
          ODOO_API_KEY=${{ secrets.ODOO_API_KEY }}
          ODOO_JSONRPC_URL=${{ secrets.ODOO_JSONRPC_URL }}
          ODOO_DB=${{ secrets.ODOO_DB }}
          ODOO_UID=${{ secrets.ODOO_UID }}
          PRESTASHOP_API_URL=${{ secrets.PRESTASHOP_API_URL }}
          PRESTASHOP_API_URL_WASM=${{ secrets.PRESTASHOP_API_URL_WASM }}
          SURREAL_GUEST_PASSWORD=${{ secrets.SURREAL_GUEST_PASSWORD }}
          XIDAX_ADMIN_URL=${{ secrets.XIDAX_ADMIN_URL }}
          # Fleet orchestrator: empty values are valid ("fleet reporting disabled").
          # Set the GitHub repo secrets when ready to enable.
          ORCHESTRATOR_URL=${{ secrets.ORCHESTRATOR_URL }}
          ORCHESTRATOR_URL_DEV=${{ secrets.ORCHESTRATOR_URL_DEV }}
          ENVEOF

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build and Push ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.name }}-release
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-release

