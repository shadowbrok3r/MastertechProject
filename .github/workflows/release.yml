name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - '4.*'
  pull_request:
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1.9.1
        with:
          title: MasterTech $tag
          allow-missing-changelog: true
          token: ${{ secrets.GITHUB_TOKEN }}

  native-build:
    name: Build and Upload Native Binaries
    needs: create-release
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin: MasterTech         # ← crate binary name
            artifact: Mastertech-linux  # ← renamed file for upload
            runs_on: self-hosted
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: MasterTech
            artifact: Mastertech.exe
            runs_on: windows-latest

    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4

      - name: Install PipeWire deps (Linux only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          echo ${{ secrets.USERPWD }} | sudo -S apt-get update
          echo ${{ secrets.USERPWD }} | sudo -S apt-get install -y libpipewire-0.3-dev pkg-config libegl1-mesa-dev libgbm-dev

      - name: Upload Binary to GitHub Release
        uses: taiki-e/upload-rust-binary-action@v1.27.0
        with:
          bin: ${{ matrix.bin }}
          target: ${{ matrix.target }}
          tar: none
          zip: none
          token: ${{ secrets.GITHUB_TOKEN }}
          asset: target/${{ matrix.target }}/release/${{ matrix.bin }}

  trunk:
    name: Build WASM frontend (Trunk)
    runs-on: self-hosted
    env:
      RUSTFLAGS: -C target-feature=+atomics,+bulk-memory,+mutable-globals --cfg=getrandom_backend="wasm_js"
    steps:
      - uses: actions/checkout@v4

      - name: Patch workspace for MasterTech build
        run: |
          cat Cargo.toml
          # Ensure MasterTech is in the workspace
          sed -i '/members =/ s/\]/, "MasterTech"\]/' Cargo.toml
          # Remove MtechServer2.0 from the workspace
          sed -i -E 's/"MtechServer2\.0",?\s*//g; s/\[\s*,/\[/; s/,\s*\]/]/; s/"\s*"/", "/g' Cargo.toml
          cat Cargo.toml

      - name: Install Rust Toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: wasm32-unknown-unknown
          override: true

      - name: Download and Install Trunk
        run: wget -qO- https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-musl.tar.gz | tar -xzf-
      
      - name: Patch workspace for Trunk build
        run: |
          cat Cargo.toml
          # Ensure MtechServer2.0 is in the workspace
          sed -i '/members =/ s/\]/, "MtechServer2.0"\]/' Cargo.toml
          # Remove MasterTech from the workspace
          sed -i -E 's/"MasterTech",?\s*//g; s/\[\s*,/\[/; s/,\s*\]/]/; s/"\s*"/", "/g' Cargo.toml
          cat Cargo.toml
        shell: bash

      - name: Build with Trunk
        working-directory: ./MtechServer2.0
        run: ../trunk build --release --config Trunk.toml

  docker:
    name: Build and Push Docker Image
    needs: trunk
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: "v0.11.2"
          driver: docker

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: shadowbrok3r/mtechserver:beta
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || 'type=registry,push=true' }}

