on: [push, pull_request, workflow_dispatch]

name: CI

env:
  RUSTFLAGS: -C target-feature=+crt-static

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-latest
          TARGET: x86_64-pc-windows-msvc
          EXTENSION: .exe

    steps:
    - name: Building ${{ matrix.TARGET }}
      run: echo "${{ matrix.TARGET }}"
      
    - name: Set Env
      run: echo "ACTIONS_ALLOW_UNSECURE_COMMANDS=true" >> $GITHUB_ENV

    - uses: actions/checkout@master

    - name: Extract version
      id: extract_version
      run: |
        $version = ""
        # Check if this is a pull request with a release title
        if ("${{ github.event_name }}" -eq "pull_request") {
          $pr_title = "${{ github.event.pull_request.title }}"
          if ($pr_title -match "release\s+(\d+\.\d+\.\d+)") {
            $version = $matches[1]
          }
        }
        # If no version from PR, get from Cargo.toml
        if (-not $version) {
          $fileContent = Get-Content -Path Mastertech4.0/Cargo.toml
          foreach ($line in $fileContent) {
            if ($line -match 'version\s*=\s*"(.*)"') {
              $version = $matches[1]
              break
            }
          }
        }
        if (-not $version) {
          throw "Version not found in PR title or Cargo.toml"
        }
        echo "version=$version" >> $GITHUB_ENV
        echo "VERSION=$version" > version.txt
      shell: pwsh

    - uses: actions-rs/toolchain@v1.0.1
      with:
        toolchain: stable
        target: ${{ matrix.TARGET }}
        override: true

    - uses: actions-rs/cargo@v1
      with:
        use-cross: true
        command: build
        args: --verbose --release --target=${{ matrix.TARGET }}

    - name: Rename
      run: cp target/${{ matrix.TARGET }}/release/MasterTech${{ matrix.EXTENSION }} Mastertech${{ matrix.EXTENSION }}

    - uses: actions/upload-artifact@master
      with:
        name: Mastertech${{ matrix.EXTENSION }}
        path: Mastertech${{ matrix.EXTENSION }}

    - name: Create tag
      if: ${{ github.event_name == 'push' }}
      run: |
        git tag v${{ env.version }}
        git push origin v${{ env.version }}

    - name: Create Release
      id: create_release
      if: ${{ github.event_name == 'push' }}
      uses: actions/create-release@latest
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ env.version }}
        release_name: Mastertech ${{ env.version }}
        body: |
          Release Mastertech ${{ env.version }}
        draft: false
        prerelease: false

    - uses: svenstaro/upload-release-action@v2
      name: Upload binaries to release
      if: ${{ github.event_name == 'push' }}
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: Mastertech${{ matrix.EXTENSION }}
        asset_name: Mastertech${{ matrix.EXTENSION }}
        tag: v${{ env.version }}
        overwrite: true

    - name: Changelog
      uses: scottbrenner/generate-changelog-action@master
      id: Changelog
      env:
        REPO: ${{ github.repository }}