# Agent approve-all: agent_turn admits the `approvals` kind, agent_approval
# admits the `accepted_all_for_session` status, and agent_thread gets an
# optional `approve_all` bool that record users may read but not write (the
# broker writes it as a system user).
#
# Widened ASSERTs and a new `none | bool` field with no DEFAULT, so no row
# needs a backfill and every existing row stays writable.
# The same start-phase statements are in database/migrations/003_agent_approve_all.surql.
id = "20260926030000__agent_approve_all"
name = "agent_approve_all"
state = "planned"
source_schema_hash = "389d38c90d6dd97f39971723f1950de272289a412191ae4125286a4bd0d31b25"
target_schema_hash = "204624d23a0f85384f3bf641662ac1fab7f3c008181ff1ff8dd7ba55c93f40e0"
compatibility = "phased"
renames = []

[[steps]]
id = "widen_agent_approvals"
phase = "start"
kind = "run_sql"
sql = """
DEFINE FIELD OVERWRITE status ON agent_approval TYPE string DEFAULT 'pending'
    ASSERT $value IN ['pending', 'accepted', 'accepted_for_session', 'accepted_all_for_session', 'declined', 'cancelled', 'answered', 'expired', 'auto_declined', 'auto_accepted', 'resolved_elsewhere', 'failed'] PERMISSIONS FULL;
DEFINE FIELD OVERWRITE kind ON agent_turn TYPE string DEFAULT 'start'
    ASSERT $value IN ['start', 'steer', 'interrupt', 'close', 'queue', 'compact', 'rename', 'approvals'] PERMISSIONS FULL;
DEFINE FIELD OVERWRITE approve_all ON agent_thread TYPE none | bool
    PERMISSIONS FOR select FULL, FOR create, update NONE;
"""

[[steps]]
id = "narrow_agent_approvals"
phase = "rollback"
kind = "run_sql"
sql = """
REMOVE FIELD IF EXISTS approve_all ON agent_thread;
DEFINE FIELD OVERWRITE kind ON agent_turn TYPE string DEFAULT 'start'
    ASSERT $value IN ['start', 'steer', 'interrupt', 'close', 'queue', 'compact', 'rename'] PERMISSIONS FULL;
DEFINE FIELD OVERWRITE status ON agent_approval TYPE string DEFAULT 'pending'
    ASSERT $value IN ['pending', 'accepted', 'accepted_for_session', 'declined', 'cancelled', 'answered', 'expired', 'auto_declined', 'auto_accepted', 'resolved_elsewhere', 'failed'] PERMISSIONS FULL;
"""
