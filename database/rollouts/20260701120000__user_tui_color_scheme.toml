# Additive: user_settings.tui_color_scheme (none | bytes) on the SCHEMAFULL user
# table, mirroring user_settings.color_scheme. Stores the terminal-mode
# TuiColorScheme as serialized JSON bytes; written via
# `UPDATE $auth.id SET user_settings.tui_color_scheme = $color_scheme`.
# user_settings is FLEXIBLE so old rows need no backfill; the field stays NONE
# until a user saves a theme from the TUI Settings tab.

[[steps]]
id = "add_tui_color_scheme_field"
phase = "start"
kind = "run_sql"
sql = """
DEFINE FIELD OVERWRITE user_settings.tui_color_scheme ON user TYPE none | bytes PERMISSIONS FULL;
"""

[[steps]]
id = "drop_tui_color_scheme_field"
phase = "rollback"
kind = "run_sql"
sql = """
REMOVE FIELD IF EXISTS user_settings.tui_color_scheme ON user;
"""
