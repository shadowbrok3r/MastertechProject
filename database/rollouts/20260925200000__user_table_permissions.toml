# Replaces the user table's blanket FULL permissions for record users.
#
# Table: select for signed-in staff (`$access = 'user'`), create for admins,
# update for the owner or an admin, delete for nobody. Guest and guest_user
# sessions lose all access. The old delete rule tested `$access = 'users'`,
# which no access method is named, so it never matched.
# Fields: password unreadable by any record user; minio_* and mcp_settings
# readable by the owner only; role/status/identity fields writable by admins
# only, never on their own row; settings, statuses, version and password
# writable by the owner only.
# Admin = `$auth.authorization = 'Root' AND $auth.active = true`.
# On a self-edit `$auth.authorization` reads the in-flight value, so without
# `id != $auth.id` a user could `UPDATE $auth.id SET authorization = 'Root'`.
#
# Login is unaffected: the `user` access method's SIGNIN/SIGNUP run as a
# database Editor, which bypasses table and field permissions.
# Every field the deployed `User` struct requires stays readable on every row;
# the ones hidden from non-owners are all Option<_> there.
id = "20260925200000__user_table_permissions"
name = "user_table_permissions"
state = "completed"
source_schema_hash = "c487577c5f5bc1b54d1a806b6175ecac10994ecdbfd789ea69f546a1b71b4d13"
target_schema_hash = "389d38c90d6dd97f39971723f1950de272289a412191ae4125286a4bd0d31b25"
compatibility = "phased"
renames = []

[[steps]]
id = "tighten_user_permissions"
phase = "start"
kind = "run_sql"
sql = """
DEFINE TABLE OVERWRITE user TYPE ANY SCHEMAFULL PERMISSIONS FOR select WHERE $access = 'user', FOR create WHERE $access = 'user' AND $auth.authorization = 'Root' AND $auth.active = true, FOR update WHERE $access = 'user' AND (id = $auth.id OR ($auth.authorization = 'Root' AND $auth.active = true)), FOR delete NONE;
DEFINE FIELD OVERWRITE active ON user TYPE bool DEFAULT true PERMISSIONS FOR select, create FULL, FOR update WHERE id != $auth.id AND $auth.authorization = 'Root' AND $auth.active = true;
DEFINE FIELD OVERWRITE authorization ON user TYPE string DEFAULT 'User' PERMISSIONS FOR select, create FULL, FOR update WHERE id != $auth.id AND $auth.authorization = 'Root' AND $auth.active = true;
DEFINE FIELD OVERWRITE email ON user TYPE string ASSERT string::is_email($value) PERMISSIONS FOR select, create FULL, FOR update WHERE id != $auth.id AND $auth.authorization = 'Root' AND $auth.active = true;
DEFINE FIELD OVERWRITE everest_initials ON user TYPE string PERMISSIONS FOR select, create FULL, FOR update WHERE id != $auth.id AND $auth.authorization = 'Root' AND $auth.active = true;
DEFINE FIELD OVERWRITE id_prestashop ON user TYPE none | number DEFAULT NONE PERMISSIONS FOR select, create FULL, FOR update WHERE id != $auth.id AND $auth.authorization = 'Root' AND $auth.active = true;
DEFINE FIELD OVERWRITE id_store ON user TYPE none | string DEFAULT '' PERMISSIONS FOR select, create FULL, FOR update WHERE id != $auth.id AND $auth.authorization = 'Root' AND $auth.active = true;
DEFINE FIELD OVERWRITE name ON user TYPE string PERMISSIONS FOR select, create FULL, FOR update WHERE id != $auth.id AND $auth.authorization = 'Root' AND $auth.active = true;
DEFINE FIELD OVERWRITE store ON user TYPE string PERMISSIONS FOR select, create FULL, FOR update WHERE id != $auth.id AND $auth.authorization = 'Root' AND $auth.active = true;
DEFINE FIELD OVERWRITE minio_access_key ON user TYPE none | string DEFAULT NONE PERMISSIONS FOR select WHERE id = $auth.id, FOR create FULL, FOR update WHERE id != $auth.id AND $auth.authorization = 'Root' AND $auth.active = true;
DEFINE FIELD OVERWRITE minio_secret_key ON user TYPE none | string DEFAULT NONE PERMISSIONS FOR select WHERE id = $auth.id, FOR create FULL, FOR update WHERE id != $auth.id AND $auth.authorization = 'Root' AND $auth.active = true;
DEFINE FIELD OVERWRITE password ON user TYPE string PERMISSIONS FOR select NONE, FOR create FULL, FOR update WHERE id = $auth.id;
DEFINE FIELD OVERWRITE version ON user TYPE string PERMISSIONS FOR select, create FULL, FOR update WHERE id = $auth.id;
DEFINE FIELD OVERWRITE mcp_settings ON user TYPE object DEFAULT {} PERMISSIONS FOR select WHERE id = $auth.id, FOR create FULL, FOR update WHERE id = $auth.id;
DEFINE FIELD OVERWRITE mcp_settings.endpoint ON user TYPE none | string PERMISSIONS FOR select WHERE id = $auth.id, FOR create FULL, FOR update WHERE id = $auth.id;
DEFINE FIELD OVERWRITE mcp_settings.api_key ON user TYPE none | string PERMISSIONS FOR select WHERE id = $auth.id, FOR create FULL, FOR update WHERE id = $auth.id;
DEFINE FIELD OVERWRITE mcp_settings.model ON user TYPE none | string PERMISSIONS FOR select WHERE id = $auth.id, FOR create FULL, FOR update WHERE id = $auth.id;
DEFINE FIELD OVERWRITE user_settings ON user TYPE object FLEXIBLE DEFAULT { color_scheme: {  }, ui_layout: { mastertech: {  }, mtechserver: {  } } } PERMISSIONS FOR select, create FULL, FOR update WHERE id = $auth.id;
DEFINE FIELD OVERWRITE user_settings.color_scheme ON user TYPE none | bytes PERMISSIONS FOR select, create FULL, FOR update WHERE id = $auth.id;
DEFINE FIELD OVERWRITE user_settings.tui_color_scheme ON user TYPE none | bytes PERMISSIONS FOR select, create FULL, FOR update WHERE id = $auth.id;
DEFINE FIELD OVERWRITE user_settings.ui_layout ON user TYPE none | object FLEXIBLE DEFAULT { mastertech: {  }, mtechserver: {  } } PERMISSIONS FOR select, create FULL, FOR update WHERE id = $auth.id;
DEFINE FIELD OVERWRITE user_settings.ui_layout.mastertech ON user TYPE none | object FLEXIBLE DEFAULT {  } PERMISSIONS FOR select, create FULL, FOR update WHERE id = $auth.id;
DEFINE FIELD OVERWRITE user_settings.ui_layout.mtechserver ON user TYPE none | object FLEXIBLE DEFAULT {  } PERMISSIONS FOR select, create FULL, FOR update WHERE id = $auth.id;
DEFINE FIELD OVERWRITE user_settings.ui_layout.default_work_mode ON user TYPE none | string ASSERT $value == NONE OR $value IN ['tuneup_qc', 'diagnostic', 'admin', 'full'] PERMISSIONS FOR select, create FULL, FOR update WHERE id = $auth.id;
DEFINE FIELD OVERWRITE user_statuses ON user TYPE none | array<string> DEFAULT [] PERMISSIONS FOR select, create FULL, FOR update WHERE id = $auth.id;
DEFINE FIELD OVERWRITE user_statuses.* ON user TYPE string PERMISSIONS FOR select, create FULL, FOR update WHERE id = $auth.id;
"""

