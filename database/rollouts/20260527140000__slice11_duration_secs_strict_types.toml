# ── Background ──────────────────────────────────────────────────────────
#
# The previous schema typed both `duration_*_secs` fields as `none | number`,
# which let SurrealDB persist them as either int or float depending on the
# write path. `StressTestRun::finalize` derives the value from
# `duration::secs(($ended_at ?? time::now()) - started_at)`, and
# `duration::secs(...)` returns an **integer** whenever the elapsed window
# happens to be a whole number of seconds (every test that rounds to a
# full second — most of them).
#
# The Rust struct, by contrast, types these strictly:
#   `duration_planned_secs: Option<u64>`
#   `duration_actual_secs:  Option<f64>`
#
# When `Vec<StressTestRun>` deserializes a row whose `duration_actual_secs`
# happened to land as an int, the SurrealValue derive refuses with
# `"Failed to convert to none | float: Expected float, got number"` and the
# whole stress_lab list fetch errors out. Symptom seen in field logs:
#   13:34:47 [WARN ] displays::tabs::stress_lab
#       stress_lab runs fetch: Failed to deserialize field
#       'duration_actual_secs' on type 'StressTestRun': …
#
# ── Fix ─────────────────────────────────────────────────────────────────
#
# Three layers landed simultaneously — only #2 is a schema change, hence
# this rollout. The other two are Rust-side fixes that ship in the same
# release:
#
#   1. Write site (`StressTestRun::finalize`) now writes
#        `duration_actual_secs = <float> duration::secs(...)`
#      so new rows are always float regardless of the elapsed value.
#
#   2. Schema (this rollout) tightens both columns to the exact subtype the
#      Rust struct uses, so future writes that forget the `<float>` cast
#      get rejected at the SurrealDB layer instead of silently corrupting
#      reads.
#
#   3. Read sites (`StressTestRun::list_for_{computer,component,session}`
#      and `fetch_recent_runs`) project `<float> duration_actual_secs AS
#      duration_actual_secs` so any row written before this rollout still
#      loads cleanly — the cast at the read-side coerces stale ints up to
#      float on the way back to Rust.
#
# ── Apply ──────────────────────────────────────────────────────────────
# Everything goes in [complete]. `[start]` is empty because there's no
# "expand the schema first, then later contract it" phase here — the
# Rust-side read projection makes the new schema safe to flip in one shot.
#
# Order matters within the [complete] DDL:
#   a. Backfill existing rows under the still-permissive `none | number`
#      type, so the explicit `<float>` / `<int>` casts succeed without
#      tripping any forthcoming field validation.
#   b. THEN re-DEFINE the fields with the strict subtypes so all future
#      writes are enforced.
[start]
ddl = ""

[complete]
ddl = """
-- (a) Coerce existing rows to the new subtypes while the field still
--     accepts `number`. Each UPDATE is idempotent: rows already stored
--     as the target subtype are a no-op cast.
UPDATE stress_test_run SET duration_actual_secs  = <float> duration_actual_secs  WHERE duration_actual_secs  IS NOT NONE;
UPDATE stress_test_run SET duration_planned_secs = <int>   duration_planned_secs WHERE duration_planned_secs IS NOT NONE;

-- (b) Tighten the column types to match the Rust struct exactly.
--     duration_planned_secs is Option<u64> → SurrealDB `int`.
--     duration_actual_secs  is Option<f64> → SurrealDB `float`.
DEFINE FIELD OVERWRITE duration_planned_secs ON stress_test_run TYPE none | int   PERMISSIONS FULL;
DEFINE FIELD OVERWRITE duration_actual_secs  ON stress_test_run TYPE none | float PERMISSIONS FULL;
"""

# Rollback intentionally omitted, matching slice6/slice7 precedent. If a
