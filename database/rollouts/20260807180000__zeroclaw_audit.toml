# NONE so the trail is append-only.

[[steps]]
id = "create_zeroclaw_audit"
phase = "start"
kind = "run_sql"
sql = """
DEFINE TABLE OVERWRITE zeroclaw_audit TYPE ANY SCHEMALESS CHANGEFEED 30d PERMISSIONS FOR select, create FULL, FOR update, delete NONE;
DEFINE FIELD OVERWRITE created_at ON zeroclaw_audit TYPE datetime DEFAULT time::now() PERMISSIONS FULL;
DEFINE FIELD OVERWRITE tool ON zeroclaw_audit TYPE option<string> PERMISSIONS FULL;
DEFINE INDEX OVERWRITE zca_created_at ON zeroclaw_audit FIELDS created_at;
DEFINE INDEX OVERWRITE zca_tool ON zeroclaw_audit FIELDS tool;
"""

[[steps]]
