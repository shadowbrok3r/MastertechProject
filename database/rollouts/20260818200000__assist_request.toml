# Tech-confirmed AI assistance queue. The bench client CREATEs a pending row on
# Confirm; the headless admin agent claims it and calls the zeroclaw gateway.
# requested_by defaults from $auth so the signed-in tech is the recorded
# requester regardless of what the client sent.
id = "20260818200000__assist_request"
name = "assist_request"
state = "completed"
source_schema_hash = "343c1b3c33a8cee13a55b79961d7efcb5a6ea9df26aef083cf7cc0cb421bf23e"
target_schema_hash = "343c1b3c33a8cee13a55b79961d7efcb5a6ea9df26aef083cf7cc0cb421bf23e"
compatibility = "phased"
renames = []

[[steps]]
id = "define_assist_request"
phase = "start"
kind = "run_sql"
sql = """
DEFINE TABLE OVERWRITE assist_request TYPE ANY SCHEMALESS PERMISSIONS FULL;
DEFINE FIELD OVERWRITE agent              ON assist_request TYPE none | string PERMISSIONS FULL;
DEFINE FIELD OVERWRITE computer           ON assist_request TYPE none | record<computer> PERMISSIONS FULL;
DEFINE FIELD OVERWRITE connection_string  ON assist_request TYPE string PERMISSIONS FULL;
DEFINE FIELD OVERWRITE created_at         ON assist_request TYPE datetime DEFAULT time::now() PERMISSIONS FULL;
DEFINE FIELD OVERWRITE customer           ON assist_request TYPE none | record<customer> PERMISSIONS FULL;
DEFINE FIELD OVERWRITE dispatch_error     ON assist_request TYPE none | string PERMISSIONS FULL;
DEFINE FIELD OVERWRITE dispatched_at      ON assist_request TYPE none | datetime PERMISSIONS FULL;
DEFINE FIELD OVERWRITE finished_at        ON assist_request TYPE none | datetime PERMISSIONS FULL;
DEFINE FIELD OVERWRITE hostname           ON assist_request TYPE none | string PERMISSIONS FULL;
DEFINE FIELD OVERWRITE machine_confirmed  ON assist_request TYPE bool DEFAULT false PERMISSIONS FULL;
DEFINE FIELD OVERWRITE requested_by       ON assist_request TYPE none | string DEFAULT $auth.email PERMISSIONS FULL;
DEFINE FIELD OVERWRITE service_number     ON assist_request TYPE none | string PERMISSIONS FULL;
DEFINE FIELD OVERWRITE service_order      ON assist_request TYPE none | record<service_order> PERMISSIONS FULL;
DEFINE FIELD OVERWRITE status             ON assist_request TYPE string DEFAULT 'pending' ASSERT $value IN ['pending', 'dispatched', 'completed', 'failed', 'declined'] PERMISSIONS FULL;
DEFINE FIELD OVERWRITE store              ON assist_request TYPE none | string PERMISSIONS FULL;
DEFINE FIELD OVERWRITE tech_note          ON assist_request TYPE none | string ASSERT $value == NONE OR string::len($value) <= 500 PERMISSIONS FULL;
DEFINE FIELD OVERWRITE trigger_source     ON assist_request TYPE string DEFAULT 'tur_sheet' ASSERT $value IN ['auto', 'tur_sheet'] PERMISSIONS FULL;
DEFINE INDEX OVERWRITE assist_request_status_idx ON assist_request FIELDS status;
"""

[[steps]]
id = "remove_assist_request"
phase = "rollback"
kind = "run_sql"
sql = """
REMOVE TABLE IF EXISTS assist_request;
"""
