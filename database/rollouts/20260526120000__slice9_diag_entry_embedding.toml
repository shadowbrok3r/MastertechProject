# Drops the orphaned HNSW index that was blocking diagnostic_entry inserts
# with "Incorrect vector dimension (0). Expected 768." when no embedding is
# provided. fn::embed_text is not yet implemented — re-add the HNSW in a
# future slice once Ollama is wired and a real backfill has run.
compatibility = "phased"
renames = []

# ── Apply ──────────────────────────────────────────────────────────────────────
# Removes all known variants of the orphaned index. OVERWRITE re-declares the
# field so the schema stays consistent. All idempotent / IF EXISTS.

[start]
ddl = ""

[complete]
ddl = """
REMOVE INDEX IF EXISTS diagnostic_entry_embedding ON diagnostic_entry;
REMOVE INDEX IF EXISTS diagentry_embedding ON diagnostic_entry;
REMOVE INDEX IF EXISTS diag_embedding ON diagnostic_entry;

DEFINE FIELD OVERWRITE embedding   ON diagnostic_entry TYPE array<float> DEFAULT [] PERMISSIONS FULL;
DEFINE FIELD OVERWRITE embedding.* ON diagnostic_entry TYPE float                  PERMISSIONS FULL;
"""
