[package]
name = "database"
version = "0.1.0"
edition = "2024"

[features]
default = []
desktop = ["rfd"]  # Include GUI dependencies for desktop builds

[dependencies]
arc-swap = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query"] }
thiserror = "2"
xml = "1"
# surrealdb-alpha ={ workspace = true }
surrealdb.workspace = true
serde_json.workspace = true
web-time.workspace = true
crossbeam.workspace = true
async-trait.workspace = true
once_cell.workspace = true
structdiff.workspace = true
anyhow.workspace = true
rusty-s3.workspace = true
futures.workspace = true
regex.workspace = true
chrono = {workspace=true}
facet = { workspace = true, features = ["std", "chrono"] }
serde.workspace = true
bytes = {workspace = true}
brotli.workspace = true
rfd = { workspace = true, optional = true }
log.workspace = true
fuzzy-matcher.workspace = true
uuid = { workspace = true }
surrealdb-types = { workspace = true }
dump-triage = { path = "../dump-triage", default-features = false }
sha2 = "0.10"
hex = "0.4"

[build-dependencies]
dotenvy.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }
# Native TLS backend so direct HTTPS from this crate works standalone; on
# wasm32 reqwest uses the browser fetch and ignores this.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[dev-dependencies]
surrealdb = { workspace = true, features = ["kv-mem"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tcp_protocol = { path = "../tcp_protocol", features = ["fingerprint"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures.workspace = true
gloo-timers = { version = "0.3", features = ["futures"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_SystemInformation"] }