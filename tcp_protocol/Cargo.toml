[package]
name = "tcp_protocol"
version = "0.1.0"
edition = "2024"
description = "Shared wire-protocol constants and TCP socket configuration for the MasterTech admin↔client direct TCP path."

[features]
fingerprint = ["dep:facet"]
# WebSocket byte-stream tunnel transport (relay-carried admin↔client sessions).
tunnel = ["dep:tokio-tungstenite", "dep:futures", "dep:bytes"]

[dependencies]
log = { workspace = true }
serde = { workspace = true }
bincode = { workspace = true }
facet = { workspace = true, optional = true }

# tokio/socket2 back the OS-side TCP helpers only; exclude the firmware (uefi)
# and wasm targets, which use just the serde frame types.
[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "uefi")))'.dependencies]
tokio = { workspace = true }
socket2 = "0.6"
# 0.26 matches the ewebsock fork's tokio-tungstenite so both resolve to one build.
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"], optional = true }
futures = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
