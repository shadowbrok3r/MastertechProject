[package]
name = "stress-kit"
version = "0.1.0"
edition = "2024"
description = "CPU, memory, disk, and GPU stress primitives + hardware telemetry for desktop apps"

[features]
default = ["gpu", "nvml"]
# Brings in wgpu + pollster + bytemuck for the GPU stressors. Disable for
# headless / build-server contexts
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
# NVML-backed GPU telemetry (NVIDIA only; no-op on AMD/Intel).
nvml = ["dep:nvml-wrapper"]
# Embeds WinRing0 and reads CPU/board temps over MSR/PCI. Off by default: it
# bundles a flagged kernel driver that only loads with Windows driver protections
# lowered (see drivers/). Enable per-app where elevated QC temp reads are wanted.
winring0-thermal = ["dep:raw-cpuid"]

[dependencies]
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sysinfo = { version = "0.39", features = ["serde", "multithread"] }

wgpu      = { version = "26", optional = true, default-features = false, features = ["dx12", "vulkan", "metal", "wgsl"] }
pollster  = { version = "0.4", optional = true }
bytemuck  = { version = "1.20", optional = true, features = ["derive"] }
nvml-wrapper = { version = "0.12", optional = true, features = ["serde"] }
raw-cpuid = { version = "11", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Performance",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_System_IO",
]}
wmi = "=0.18.3"
evtx = "0.11"
# WinRing0 loader (winring0-thermal feature); SCM + device IO via winapi.
winapi = { version = "0.3", features = ["fileapi", "ioapiset", "winnt", "handleapi", "errhandlingapi", "winbase", "synchapi", "processthreadsapi", "minwindef", "winsvc", "std"] }
