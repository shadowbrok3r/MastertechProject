[package]
name = "stress-kit"
version = "0.1.0"
edition = "2024"
description = "CPU, memory, disk, and GPU stress primitives + hardware telemetry for desktop apps"

[features]
default = ["gpu", "nvml"]
# Brings in wgpu + pollster + bytemuck for the GPU stressors. Disable for
# headless / build-server contexts
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
# NVML-backed GPU telemetry (NVIDIA only; no-op on AMD/Intel).
nvml = ["dep:nvml-wrapper"]
# Compiles the CPU die and board rail readers over the (always-present)
# `lowlevel` access layer. Ships no driver on its own — a backend feature below
# selects one, and with none selected the readers report AccessTier::None.
lowlevel = ["dep:raw-cpuid"]
# Backends. Selection among the compiled-in set happens at runtime.
# DEPRECATED: embeds WinRing0 (CVE-2020-14979), which only loads with Windows
# driver protections lowered and is quarantined by current Defender definitions.
backend-winring0 = ["lowlevel"]
# Mastertech's own signed driver with a fixed register allowlist.
backend-mtdrv = ["lowlevel"]
# Scripted backend so downstream crates can test the readers without hardware.
mock-backend = ["lowlevel"]
# What the apps enable.
hw-sensors = ["backend-winring0"]
# Deprecated alias kept so consumers keep building through the migration.
winring0-thermal = ["backend-winring0"]
# JsonSchema derive on wire types for MCP consumers (unifies with rmcp's schemars 1.x).
schemars = ["dep:schemars"]

[dependencies]
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
facet = { workspace = true, features = ["reflect"] }
schemars = { version = "1", optional = true }
sysinfo = { version = "0.39", features = ["serde", "multithread"] }

wgpu      = { version = "30.0.0", optional = true, default-features = false, features = ["dx12", "vulkan", "metal", "wgsl"] }
pollster  = { version = "1.0.1", optional = true }
bytemuck  = { version = "1.20", optional = true, features = ["derive"] }
nvml-wrapper = { version = "0.12", optional = true, features = ["serde"] }
raw-cpuid = { version = "11", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Performance",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_System_EventLog",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
]}
wmi = "=0.18.3"
evtx = "0.11"
# Kernel-driver backends: SCM, device IO, shared bus mutexes, thread affinity.
winapi = { version = "0.3", features = ["fileapi", "ioapiset", "winnt", "handleapi", "errhandlingapi", "winbase", "synchapi", "processthreadsapi", "minwindef", "minwinbase", "winsvc", "sddl", "securitybaseapi", "std"] }
