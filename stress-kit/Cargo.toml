[package]
name = "stress-kit"
version = "0.1.0"
edition = "2024"
description = "CPU, memory, and disk stress primitives and hardware telemetry for desktop apps"

[dependencies]
log = { workspace = true }
serde = { workspace = true }
sysinfo = { version = "0.39", features = ["serde", "multithread"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Performance",
    "Win32_NetworkManagement_IpHelper",
]}
wmi = "=0.18.3"
evtx = "0.11"
